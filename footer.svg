<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 130" width="1200" height="130">
  <defs>
    <linearGradient id="bgGrad_f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassBtn_f1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#203c4c;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#12242e;stop-opacity:0.9"/>
    </linearGradient>

    <filter id="btnGlow_c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="btnGlow_r" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseBtn1 { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    @keyframes pulseBtn2 { 0%,100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    .mono_f { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_f { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .btn-gold { animation: pulseBtn1 3s ease-in-out infinite; }
    .btn-rose { animation: pulseBtn2 3s ease-in-out 1.5s infinite; }
    a { cursor: pointer; }
  </style>

  <rect width="1200" height="130" fill="url(#bgGrad_f)" rx="16"/>

  <!-- Glass social badges with clickability & glow -->
  <g transform="translate(140, 22)">
    <!-- GitHub -->
    <a href="https://github.com/Ankit-Basu" target="_blank">
      <g>
        <rect x="0" y="0" width="200" height="40" rx="12" fill="url(#glassBtn_f1)" stroke="#fbe2a7" stroke-width="1.2" class="btn-gold" filter="url(#btnGlow_c)"/>
        <text x="100" y="25" class="mono_f" font-size="12" font-weight="700" fill="#fbe2a7" text-anchor="middle">&#x2B22; GitHub &#x2022; Ankit-Basu</text>
      </g>
    </a>

    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/in/ankit-basu-4a6774297/" target="_blank">
      <g transform="translate(225, 0)">
        <rect x="0" y="0" width="200" height="40" rx="12" fill="url(#glassBtn_f1)" stroke="#e4a2b1" stroke-width="1.2" class="btn-rose" filter="url(#btnGlow_r)"/>
        <text x="100" y="25" class="mono_f" font-size="12" font-weight="700" fill="#e4a2b1" text-anchor="middle">&#x2605; LinkedIn &#x2022; Ankit</text>
      </g>
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/_ank1t._/" target="_blank">
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="190" height="40" rx="12" fill="url(#glassBtn_f1)" stroke="#fbe2a7" stroke-width="1.2" class="btn-gold" filter="url(#btnGlow_c)"/>
        <text x="95" y="25" class="mono_f" font-size="12" font-weight="700" fill="#fbe2a7" text-anchor="middle">&#x25C6; IG &#x2022; _ank1t._</text>
      </g>
    </a>

    <!-- Email -->
    <a href="mailto:ankitbasu935@gmail.com" target="_blank">
      <g transform="translate(665, 0)">
        <rect x="0" y="0" width="255" height="40" rx="12" fill="url(#glassBtn_f1)" stroke="#e4a2b1" stroke-width="1.2" class="btn-rose" filter="url(#btnGlow_r)"/>
        <text x="127" y="25" class="mono_f" font-size="11.5" font-weight="700" fill="#e4a2b1" text-anchor="middle">&#x2709; ankitbasu935@gmail.com</text>
      </g>
    </a>
  </g>

  <!-- Tagline -->
  <text x="600" y="92" class="sans_f" font-size="11" font-weight="700" fill="#8a97a0" text-anchor="middle" letter-spacing="3">INNOVATE &#x2022; SCALE &#x2022; ARCHITECT &#x2022; SHIP</text>
  <text x="600" y="112" class="sans_f" font-size="11" font-weight="500" fill="#fbe2a7" text-anchor="middle" opacity="0.85" font-style="italic">"Turning ambitious engineering ideas into scalable, production reality."</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <linearGradient id="bgGrad_f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassBtn_f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.65"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.8"/>
    </linearGradient>

    <filter id="btnGlow_f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono_f { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_f { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <rect width="1200" height="120" fill="url(#bgGrad_f)" rx="16"/>

  <!-- Glass social badges with glow treatment -->
  <g transform="translate(160, 20)">
    <!-- GitHub -->
    <rect x="0" y="0" width="190" height="36" rx="10" fill="url(#glassBtn_f)" stroke="#fbe2a7" stroke-width="1.2" stroke-opacity="0.4" filter="url(#btnGlow_f)"/>
    <text x="95" y="23" class="mono_f" font-size="12" font-weight="700" fill="#fbe2a7" text-anchor="middle">&#x2022; GitHub &#x2022; Ankit-Basu</text>

    <!-- LinkedIn -->
    <rect x="210" y="0" width="190" height="36" rx="10" fill="url(#glassBtn_f)" stroke="#e4a2b1" stroke-width="1.2" stroke-opacity="0.4" filter="url(#btnGlow_f)"/>
    <text x="305" y="23" class="mono_f" font-size="12" font-weight="700" fill="#e4a2b1" text-anchor="middle">&#x2022; LinkedIn &#x2022; Ankit</text>

    <!-- Instagram -->
    <rect x="420" y="0" width="190" height="36" rx="10" fill="url(#glassBtn_f)" stroke="#fbe2a7" stroke-width="1.2" stroke-opacity="0.4" filter="url(#btnGlow_f)"/>
    <text x="515" y="23" class="mono_f" font-size="12" font-weight="700" fill="#fbe2a7" text-anchor="middle">&#x2022; IG &#x2022; _ank1t._</text>

    <!-- Email -->
    <rect x="630" y="0" width="250" height="36" rx="10" fill="url(#glassBtn_f)" stroke="#e4a2b1" stroke-width="1.2" stroke-opacity="0.4" filter="url(#btnGlow_f)"/>
    <text x="755" y="23" class="mono_f" font-size="11" font-weight="700" fill="#e4a2b1" text-anchor="middle">&#x2709; ankitbasu935@gmail.com</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="82" class="sans_f" font-size="12" font-weight="600" fill="#8a97a0" text-anchor="middle" letter-spacing="3">INNOVATE &#x2022; SCALE &#x2022; ARCHITECT &#x2022; SHIP</text>
  <text x="600" y="104" class="sans_f" font-size="11" font-weight="400" fill="#f5f0e8" text-anchor="middle" opacity="0.7" font-style="italic">"Turning ambitious ideas into scalable engineering reality."</text>
</svg>
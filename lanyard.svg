<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#07101f"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f1d32"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="33%" style="stop-color:#a78bfa"/>
      <stop offset="66%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4338ca"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes swing {
      0%, 100% { transform: rotate(-1deg); transform-origin: 210px 0px; }
      50% { transform: rotate(1deg); transform-origin: 210px 0px; }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
    @keyframes borderRotate {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .card-group { animation: swing 6s ease-in-out infinite; }
    .glow-pulse { animation: glowPulse 3s ease-in-out infinite; }
    .border-anim { animation: borderRotate 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="420" height="580" fill="url(#bg)" rx="0"/>

  <g class="card-group">
    <!-- Lanyard straps -->
    <g>
      <!-- Left strap -->
      <path d="M 160 0 Q 160 40, 175 70 L 175 130" fill="none" stroke="url(#strapGrad)" stroke-width="24" stroke-linecap="round"/>
      <!-- Right strap -->
      <path d="M 260 0 Q 260 40, 245 70 L 245 130" fill="none" stroke="url(#strapGrad)" stroke-width="24" stroke-linecap="round"/>

      <!-- Strap text -->
      <text x="148" y="50" class="mono" fill="#c7d2fe" font-size="8" font-weight="600" letter-spacing="3" transform="rotate(-8, 148, 50)">ANKIT BASU</text>
      <text x="248" y="50" class="mono" fill="#c7d2fe" font-size="8" font-weight="600" letter-spacing="3" transform="rotate(8, 248, 50)">ANKIT BASU</text>
    </g>

    <!-- Clip connector -->
    <rect x="195" y="115" width="30" height="20" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
    <rect x="205" y="110" width="10" height="10" rx="5" fill="none" stroke="#475569" stroke-width="2"/>

    <!-- Card glow background -->
    <rect x="60" y="140" width="300" height="400" rx="16" fill="url(#border)" opacity="0.15" filter="url(#glow)" class="glow-pulse"/>

    <!-- Main card -->
    <rect x="65" y="145" width="290" height="390" rx="14" fill="url(#cardBg)" filter="url(#cardShadow)"/>

    <!-- Animated border -->
    <rect x="65" y="145" width="290" height="390" rx="14" fill="none" stroke="url(#border)" stroke-width="1.5" stroke-dasharray="8 4" class="border-anim"/>

    <!-- Header text -->
    <text x="210" y="178" class="mono" fill="#64748b" font-size="10" text-anchor="middle" letter-spacing="3">DEVELOPER ID • AB-2023</text>
    <text x="210" y="196" class="mono" fill="#a78bfa" font-size="9" text-anchor="middle" letter-spacing="2">FULL STACK • ML • DEVOPS</text>

    <!-- Avatar circle -->
    <circle cx="210" cy="260" r="52" fill="#0f172a" stroke="url(#avatarBorder)" stroke-width="2.5"/>
    <circle cx="210" cy="260" r="44" fill="#1e293b"/>
    <text x="210" y="275" class="sans" fill="url(#border)" font-size="36" font-weight="900" text-anchor="middle" filter="url(#textGlow)">AB</text>

    <!-- Name -->
    <text x="210" y="340" class="sans" fill="#f1f5f9" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">ANKIT BASU</text>
    <text x="210" y="360" class="mono" fill="#67e8f9" font-size="11" text-anchor="middle">@Ankit-Basu</text>

    <!-- Info rows -->
    <g>
      <text x="115" y="395" class="mono" fill="#64748b" font-size="10">ROLE</text>
      <text x="190" y="395" class="mono" fill="#e2e8f0" font-size="11" font-weight="600">ENGINEER / BUILDER</text>
    </g>
    <g>
      <text x="115" y="418" class="mono" fill="#64748b" font-size="10">STATUS</text>
      <text x="190" y="418" class="mono" fill="#4ade80" font-size="11" font-weight="600">OPEN TO COLLABORATE</text>
    </g>

    <!-- Barcode decoration -->
    <g opacity="0.6">
      <rect x="115" y="435" width="2" height="25" fill="#475569"/>
      <rect x="120" y="435" width="4" height="25" fill="#475569"/>
      <rect x="127" y="435" width="1" height="25" fill="#475569"/>
      <rect x="131" y="435" width="3" height="25" fill="#475569"/>
      <rect x="137" y="435" width="2" height="25" fill="#475569"/>
      <rect x="142" y="435" width="5" height="25" fill="#475569"/>
      <rect x="150" y="435" width="1" height="25" fill="#475569"/>
      <rect x="154" y="435" width="3" height="25" fill="#475569"/>
      <rect x="160" y="435" width="2" height="25" fill="#475569"/>
      <rect x="165" y="435" width="4" height="25" fill="#475569"/>
      <rect x="172" y="435" width="1" height="25" fill="#475569"/>
      <rect x="176" y="435" width="6" height="25" fill="#475569"/>
      <rect x="185" y="435" width="2" height="25" fill="#475569"/>
      <rect x="190" y="435" width="3" height="25" fill="#475569"/>
      <rect x="196" y="435" width="1" height="25" fill="#475569"/>
      <rect x="200" y="435" width="4" height="25" fill="#475569"/>
      <rect x="207" y="435" width="2" height="25" fill="#475569"/>
      <rect x="212" y="435" width="5" height="25" fill="#475569"/>
      <rect x="220" y="435" width="1" height="25" fill="#475569"/>
      <rect x="224" y="435" width="3" height="25" fill="#475569"/>
      <rect x="230" y="435" width="2" height="25" fill="#475569"/>
      <rect x="235" y="435" width="4" height="25" fill="#475569"/>
      <rect x="242" y="435" width="1" height="25" fill="#475569"/>
      <rect x="246" y="435" width="3" height="25" fill="#475569"/>
      <rect x="252" y="435" width="5" height="25" fill="#475569"/>
      <rect x="260" y="435" width="2" height="25" fill="#475569"/>
      <rect x="265" y="435" width="1" height="25" fill="#475569"/>
      <rect x="269" y="435" width="4" height="25" fill="#475569"/>
      <rect x="276" y="435" width="2" height="25" fill="#475569"/>
      <rect x="281" y="435" width="3" height="25" fill="#475569"/>
      <rect x="287" y="435" width="1" height="25" fill="#475569"/>
      <rect x="291" y="435" width="5" height="25" fill="#475569"/>
      <rect x="299" y="435" width="2" height="25" fill="#475569"/>
    </g>

    <!-- Bottom text -->
    <text x="210" y="478" class="mono" fill="#475569" font-size="8" text-anchor="middle" letter-spacing="3">2026 • CODE • BUILD • REPEAT</text>
  </g>

  <!-- Bottom quote -->
  <text x="210" y="560" class="mono" fill="#64748b" font-size="11" text-anchor="middle" font-style="italic">Turning ideas into real-world solutions.</text>
</svg>

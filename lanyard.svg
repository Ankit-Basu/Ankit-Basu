<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/><stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>
    <linearGradient id="glass_l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3040;stop-opacity:0.6"/><stop offset="100%" style="stop-color:#12242e;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="chip_l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22404f"/><stop offset="100%" style="stop-color:#152c38"/>
    </linearGradient>
    <linearGradient id="statBx" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#142e3c"/><stop offset="100%" style="stop-color:#0d1f2a"/>
    </linearGradient>
    <filter id="cG_l" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rG_l" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh_l" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    @keyframes fadeUp1 { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fadeUp2 { 0%,15% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fadeUp3 { 0%,30% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes fadeUp4 { 0%,45% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes chipIn { 0% { opacity: 0; } 100% { opacity: 1; } }

    .mono_l { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_l { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .s1 { opacity: 0; animation: fadeUp1 0.6s ease 0.2s forwards; }
    .s2 { opacity: 0; animation: fadeUp2 0.6s ease 0.2s forwards; }
    .s3 { opacity: 0; animation: fadeUp3 0.6s ease 0.2s forwards; }
    .s4 { opacity: 0; animation: fadeUp4 0.6s ease 0.2s forwards; }
    .c1 { opacity:0; animation: chipIn 0.4s ease 0.5s forwards; }
    .c2 { opacity:0; animation: chipIn 0.4s ease 0.56s forwards; }
    .c3 { opacity:0; animation: chipIn 0.4s ease 0.62s forwards; }
    .c4 { opacity:0; animation: chipIn 0.4s ease 0.68s forwards; }
    .c5 { opacity:0; animation: chipIn 0.4s ease 0.74s forwards; }
    .c6 { opacity:0; animation: chipIn 0.4s ease 0.80s forwards; }
    .c7 { opacity:0; animation: chipIn 0.4s ease 0.86s forwards; }
    .c8 { opacity:0; animation: chipIn 0.4s ease 0.92s forwards; }
    .c9 { opacity:0; animation: chipIn 0.4s ease 0.98s forwards; }
    .c10 { opacity:0; animation: chipIn 0.4s ease 1.04s forwards; }
    .c11 { opacity:0; animation: chipIn 0.4s ease 1.10s forwards; }
  </style>

  <rect width="1200" height="360" fill="url(#bg_l)" rx="16"/>
  <rect x="28" y="16" width="1144" height="328" rx="18" fill="url(#glass_l)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#sh_l)"/>

  <!-- Header -->
  <text x="56" y="48" class="sans_l" font-size="11" font-weight="600" fill="#8a97a0" letter-spacing="2">CREDENTIALS &amp; EXPERTISE</text>
  <text x="56" y="72" class="sans_l" font-size="20" font-weight="900" fill="#fbe2a7">Skills &amp; Achievements</text>

  <!-- 4 STAT BOXES — 1 row, fixed positions (NO CSS transform, only opacity) -->
  <!-- Box 1: CGPA -->
  <g transform="translate(56, 90)" class="s1">
    <rect width="250" height="82" rx="12" fill="url(#statBx)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="4" height="82" rx="2" fill="#fbe2a7"/>
    <text x="125" y="38" class="sans_l" font-size="34" font-weight="900" fill="#fbe2a7" text-anchor="middle" filter="url(#cG_l)">9.2</text>
    <text x="125" y="58" class="mono_l" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">CGPA &#x2022; B.Tech CSE</text>
    <text x="125" y="72" class="mono_l" font-size="9" font-weight="600" fill="#8a97a0" text-anchor="middle" opacity="0.65">ISC 95% &#x2022; ICSE 97%</text>
  </g>

  <!-- Box 2: DSA -->
  <g transform="translate(322, 90)" class="s2">
    <rect width="250" height="82" rx="12" fill="url(#statBx)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="250" height="4" rx="2" fill="#e4a2b1"/>
    <text x="125" y="38" class="sans_l" font-size="34" font-weight="900" fill="#e4a2b1" text-anchor="middle" filter="url(#rG_l)">400+</text>
    <text x="125" y="58" class="mono_l" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">DSA Problems Solved</text>
    <text x="125" y="72" class="mono_l" font-size="9" font-weight="600" fill="#8a97a0" text-anchor="middle" opacity="0.65">LeetCode &#x2022; GFG &#x2022; CF</text>
  </g>

  <!-- Box 3: LC Rating -->
  <g transform="translate(588, 90)" class="s3">
    <rect width="250" height="82" rx="12" fill="url(#statBx)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="4" height="82" rx="2" fill="#fbe2a7"/>
    <text x="125" y="38" class="sans_l" font-size="34" font-weight="900" fill="#fbe2a7" text-anchor="middle" filter="url(#cG_l)">1590</text>
    <text x="125" y="58" class="mono_l" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">LeetCode Rating</text>
    <text x="125" y="72" class="mono_l" font-size="9" font-weight="600" fill="#8a97a0" text-anchor="middle" opacity="0.65">Top 25% Globally</text>
  </g>

  <!-- Box 4: Hackathons -->
  <g transform="translate(854, 90)" class="s4">
    <rect width="250" height="82" rx="12" fill="url(#statBx)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="250" height="4" rx="2" fill="#e4a2b1"/>
    <text x="125" y="38" class="sans_l" font-size="34" font-weight="900" fill="#e4a2b1" text-anchor="middle" filter="url(#rG_l)">5+</text>
    <text x="125" y="58" class="mono_l" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">Hackathon Wins</text>
    <text x="125" y="72" class="mono_l" font-size="9" font-weight="600" fill="#8a97a0" text-anchor="middle" opacity="0.65">National Podiums</text>
  </g>

  <!-- TECH STACK — 3 labeled rows -->
  <g transform="translate(56, 190)">
    <!-- LANGUAGES -->
    <text class="mono_l" font-size="10" font-weight="700" fill="#fbe2a7" letter-spacing="1.5">LANGUAGES</text>
    <g transform="translate(100, -12)">
      <g class="c1"><rect x="0" y="0" width="56" height="26" rx="7" fill="url(#chip_l)" stroke="#fbe2a7" stroke-width="1"/><text x="28" y="17" class="mono_l" font-size="10" font-weight="800" fill="#fbe2a7" text-anchor="middle">Java</text></g>
      <g class="c2"><rect x="64" y="0" width="68" height="26" rx="13" fill="url(#chip_l)" stroke="#e4a2b1" stroke-width="1"/><text x="98" y="17" class="mono_l" font-size="10" font-weight="800" fill="#e4a2b1" text-anchor="middle">Python</text></g>
      <g class="c3"><rect x="140" y="0" width="44" height="26" rx="6" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="162" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">C++</text></g>
      <g class="c4"><rect x="192" y="0" width="82" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="233" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">JavaScript</text></g>
      <g class="c5"><rect x="282" y="0" width="46" height="26" rx="6" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="305" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">SQL</text></g>
    </g>

    <!-- FRAMEWORKS -->
    <g transform="translate(440, 0)">
      <text class="mono_l" font-size="10" font-weight="700" fill="#e4a2b1" letter-spacing="1.5">FRAMEWORKS</text>
      <g transform="translate(100, -12)">
        <g class="c1"><rect x="0" y="0" width="92" height="26" rx="13" fill="url(#chip_l)" stroke="#e4a2b1" stroke-width="1"/><text x="46" y="17" class="mono_l" font-size="10" font-weight="800" fill="#e4a2b1" text-anchor="middle">React/Next</text></g>
        <g class="c2"><rect x="100" y="0" width="100" height="26" rx="6" fill="url(#chip_l)" stroke="#fbe2a7" stroke-width="1"/><text x="150" y="17" class="mono_l" font-size="10" font-weight="800" fill="#fbe2a7" text-anchor="middle">Node/Express</text></g>
        <g class="c3"><rect x="208" y="0" width="70" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="243" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">PyTorch</text></g>
        <g class="c4"><rect x="286" y="0" width="84" height="26" rx="6" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="328" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">LangChain</text></g>
      </g>
    </g>

    <!-- INFRA -->
    <g transform="translate(0, 40)">
      <text class="mono_l" font-size="10" font-weight="700" fill="#fbe2a7" letter-spacing="1.5">INFRASTRUCTURE</text>
      <g transform="translate(120, -12)">
        <g class="c6"><rect x="0" y="0" width="66" height="26" rx="6" fill="url(#chip_l)" stroke="#fbe2a7" stroke-width="1"/><text x="33" y="17" class="mono_l" font-size="10" font-weight="800" fill="#fbe2a7" text-anchor="middle">Docker</text></g>
        <g class="c7"><rect x="74" y="0" width="46" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="97" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">K8s</text></g>
        <g class="c8"><rect x="128" y="0" width="50" height="26" rx="6" fill="url(#chip_l)" stroke="#e4a2b1" stroke-width="1"/><text x="153" y="17" class="mono_l" font-size="10" font-weight="800" fill="#e4a2b1" text-anchor="middle">AWS</text></g>
        <g class="c9"><rect x="186" y="0" width="82" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="227" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">MongoDB</text></g>
        <g class="c10"><rect x="276" y="0" width="86" height="26" rx="6" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="319" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">PostgreSQL</text></g>
        <g class="c11"><rect x="370" y="0" width="58" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="399" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">Redis</text></g>
        <rect x="436" y="0" width="58" height="26" rx="6" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="465" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">CI/CD</text>
        <rect x="502" y="0" width="68" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="536" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">YOLOv8</text>
        <rect x="578" y="0" width="74" height="26" rx="6" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="615" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">Three.js</text>
        <rect x="660" y="0" width="78" height="26" rx="13" fill="url(#chip_l)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><text x="699" y="17" class="mono_l" font-size="10" font-weight="700" fill="#f5f0e8" text-anchor="middle">Socket.IO</text>
      </g>
    </g>

    <!-- Certifications bar -->
    <g transform="translate(0, 80)">
      <rect width="1088" height="40" rx="8" fill="#0d1f2a" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <text x="16" y="16" class="sans_l" font-size="10" font-weight="800" fill="#f5f0e8">&#x1F4DC; Certifications</text>
      <text x="16" y="32" class="mono_l" font-size="9.5" fill="#8a97a0"><tspan fill="#fbe2a7">NPTEL IIT:</tspan> Privacy &amp; Security  &#x2022;  <tspan fill="#e4a2b1">CSE Pathshala:</tspan> Advanced C &amp; DSA  &#x2022;  <tspan fill="#fbe2a7">LPU:</tspan> Java Application Dev</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#fbe2a7;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#e4a2b1;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="divGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7;stop-opacity:0">
        <animate attributeName="offset" values="0;1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.15" style="stop-color:#fbe2a7;stop-opacity:0.8">
        <animate attributeName="offset" values="0.15;1.15" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.3" style="stop-color:#e4a2b1;stop-opacity:0">
        <animate attributeName="offset" values="0.3;1.3" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <!-- Base line -->
  <line x1="100" y1="10" x2="1100" y2="10" stroke="url(#divLine)" stroke-width="1"/>
  <!-- Sweeping glow dot -->
  <line x1="100" y1="10" x2="1100" y2="10" stroke="url(#divGlow)" stroke-width="2.5"/>
  <!-- Center diamond -->
  <rect x="596" y="6" width="8" height="8" rx="1.5" fill="#fbe2a7" opacity="0.4" transform="rotate(45,600,10)"/>
</svg>
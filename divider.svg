<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 26" width="1200" height="26" role="img">

  <defs>
    <linearGradient id="pane_v" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.115"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.052"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.022"/>
    </linearGradient>

    <linearGradient id="rim_v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>

    <linearGradient id="spec_v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen_v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bg_v" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0c1a24"/>
      <stop offset="55%" stop-color="#081219"/>
      <stop offset="100%" stop-color="#0a1a23"/>
    </linearGradient>

    <radialGradient id="vig_v" cx="50%" cy="42%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>

    <filter id="blob_v" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="96"/>
    </filter>
    <filter id="soft_v" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow_v" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS_v" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop_v" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="dropS_v" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="grain_v" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.032"/></feComponentTransfer>
    </filter>

    <pattern id="grid_v" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
<style>
    .mono { font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Consolas,monospace; }
    .sans { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif; }
    text { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif; }
    @keyframes drift  { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(38px,-26px) scale(1.14)} }
    @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1.06)} 50%{transform:translate(-44px,30px) scale(.9)} }
    @keyframes drift3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(26px,34px)} }
    @keyframes breathe{ 0%,100%{opacity:.30} 50%{opacity:.72} }
    @keyframes blink  { 0%,45%{opacity:1} 50%,95%{opacity:.15} 100%{opacity:1} }
    @keyframes sweep  { 0%{transform:translateX(-115%)} 62%,100%{transform:translateX(115%)} }
    @keyframes rise   { 0%{transform:translateY(0);opacity:0} 12%{opacity:.75} 86%{opacity:.75} 100%{transform:translateY(-180px);opacity:0} }
    @keyframes spin   { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes spinR  { from{transform:rotate(360deg)} to{transform:rotate(0)} }
    @keyframes ev0{0%,0.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev0{animation:ev0 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev1{0%,6.2%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev1{animation:ev1 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev2{0%,12.4%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev2{animation:ev2 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev3{0%,18.5%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev3{animation:ev3 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev4{0%,24.7%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev4{animation:ev4 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev5{0%,30.9%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev5{animation:ev5 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev6{0%,37.1%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev6{animation:ev6 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev7{0%,43.2%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev7{animation:ev7 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev8{0%,49.4%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev8{animation:ev8 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev9{0%,55.6%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev9{animation:ev9 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev10{0%,61.8%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev10{animation:ev10 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev11{0%,67.9%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev11{animation:ev11 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev12{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev12{animation:ev12 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev13{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev13{animation:ev13 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev14{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev14{animation:ev14 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev15{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev15{animation:ev15 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev16{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev16{animation:ev16 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev17{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev17{animation:ev17 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev18{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev18{animation:ev18 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev19{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev19{animation:ev19 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev20{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev20{animation:ev20 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev21{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev21{animation:ev21 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev22{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev22{animation:ev22 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev23{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev23{animation:ev23 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev24{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev24{animation:ev24 1.70s cubic-bezier(.22,1,.36,1);}
    @keyframes ev25{0%,72.0%{opacity:.5;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .ev25{animation:ev25 1.70s cubic-bezier(.22,1,.36,1);}
@keyframes comet{0%{transform:translateX(0)}100%{transform:translateX(1060px)}}</style>
<rect width="1200" height="26" rx="26" fill="url(#bg_v)"/>
  <rect width="1200" height="26" rx="26" fill="url(#vig_v)"/>

  <rect x="70" y="12" width="1060" height="2" rx="1" fill="url(#spec_v)" opacity="0.55"/>
  <rect x="240" y="12.4" width="720" height="1.2" rx="0.6" fill="#fbe2a7" opacity="0.5"/>
  <g style="animation:comet 3.6s cubic-bezier(.55,0,.45,1) infinite">
    <rect x="70" y="11" width="120" height="4" rx="2" fill="url(#spec_v)"/>
    <circle cx="190" cy="13" r="3.2" fill="#ffffff" filter="url(#glow_v)"/>
  </g>
  <g transform="translate(600,13)">
    <circle r="9" fill="none" stroke="#e4a2b1" stroke-width="1.4">
      <animate attributeName="r" values="5;19;5" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".85;0;.85" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#fbe2a7" transform="rotate(45)"
          filter="url(#glow_v)"/>
    <circle r="2.6" fill="#ffffff"/>
  </g>
  <circle cx="70" cy="13" r="3.4" fill="#fbe2a7" opacity="0.8"/>
  <circle cx="1130" cy="13" r="3.4" fill="#e4a2b1" opacity="0.8"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40">
  <defs>
    <!-- Base neon gradient -->
    <linearGradient id="divBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbe2a7" stop-opacity="0"/>
      <stop offset="15%" stop-color="#fbe2a7" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#e4a2b1" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fbe2a7" stop-opacity="1"/>
      <stop offset="65%" stop-color="#e4a2b1" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#fbe2a7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e4a2b1" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes laserSweep {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: -1200; }
    }
    .base-line { animation: pulseGlow 2.5s ease-in-out infinite; }
    .laser-line { stroke-dasharray: 180 1020; animation: laserSweep 2.8s linear infinite; }
  </style>

  <!-- Ambient diffuse glow behind the line -->
  <line x1="60" y1="20" x2="1140" y2="20" stroke="url(#divBase)" stroke-width="8" opacity="0.3" filter="url(#divGlow)"/>

  <!-- Core crisp glowing line -->
  <line x1="60" y1="20" x2="1140" y2="20" stroke="url(#divBase)" stroke-width="2.5" class="base-line" filter="url(#divGlow)"/>

  <!-- Traveling bright laser pulse -->
  <line x1="60" y1="20" x2="1140" y2="20" stroke="#ffffff" stroke-width="3" class="laser-line" filter="url(#divGlow)"/>

  <!-- Left terminus geometric nodes -->
  <circle cx="60" cy="20" r="3.5" fill="#fbe2a7" opacity="0.95"/>
  <circle cx="78" cy="20" r="2" fill="#e4a2b1" opacity="0.8"/>

  <!-- Center animated jewel -->
  <g transform="translate(600, 20)">
    <!-- Outer halo ring with pulse -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="#e4a2b1" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;14;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0;0.85" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Rotating diamond -->
    <rect x="-5.5" y="-5.5" width="11" height="11" rx="2" fill="#fbe2a7" transform="rotate(45)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Right terminus geometric nodes -->
  <circle cx="1122" cy="20" r="2" fill="#fbe2a7" opacity="0.8"/>
  <circle cx="1140" cy="20" r="3.5" fill="#e4a2b1" opacity="0.95"/>
</svg>
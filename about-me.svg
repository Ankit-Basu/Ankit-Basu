<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#07101f"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>
    <linearGradient id="focusBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.4" opacity="0.3"/>
    </pattern>

    <clipPath id="topBarClip">
      <rect width="1200" height="8" rx="0"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes dotGlow { 0%,100% { r: 5; opacity: 0.7; } 50% { r: 6; opacity: 1; } }
    @keyframes slideRight { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes borderAnim { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -800; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .dot-glow { animation: dotGlow 2s ease-in-out infinite; }
    .slide-in { animation: slideRight 0.6s ease-out forwards; }
    .border-anim { animation: borderAnim 15s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="12"/>
  <rect width="1200" height="320" fill="url(#grid)" rx="12"/>

  <!-- Top gradient bar -->
  <g clip-path="url(#topBarClip)">
    <rect width="1200" height="6" fill="url(#border)" y="0"/>
  </g>

  <!-- Outer border -->
  <rect x="1" y="1" width="1198" height="318" rx="12" fill="none" stroke="url(#border)" stroke-width="1" opacity="0.4" stroke-dasharray="6 3" class="border-anim"/>

  <!-- LEFT PANEL — whoami -->
  <g>
    <!-- Section background -->
    <rect x="30" y="30" width="530" height="260" rx="10" fill="#0a1628" stroke="#1e293b" stroke-width="1" opacity="0.8"/>

    <!-- Terminal prompt -->
    <text x="50" y="62" class="mono" fill="#d946ef" font-size="13" font-weight="600">❯</text>
    <text x="65" y="62" class="mono" fill="#67e8f9" font-size="13">whoami</text>

    <!-- Name -->
    <text x="50" y="108" class="sans" fill="url(#name)" font-size="38" font-weight="900" letter-spacing="-0.5">ANKIT BASU</text>
    <text x="50" y="130" class="mono" fill="#67e8f9" font-size="12" opacity="0.7">@Ankit-Basu</text>

    <!-- Titles -->
    <text x="50" y="162" class="sans" fill="#e2e8f0" font-size="14" font-weight="700">Full Stack Developer</text>
    <text x="50" y="184" class="sans" fill="#e2e8f0" font-size="14" font-weight="700">Machine Learning Enthusiast</text>
    <text x="50" y="206" class="sans" fill="#e2e8f0" font-size="14" font-weight="700">DevOps Practitioner</text>

    <!-- Bio -->
    <text x="50" y="238" class="mono" fill="#64748b" font-size="11">Building intelligent systems &amp; scalable</text>
    <text x="50" y="254" class="mono" fill="#64748b" font-size="11">web experiences through code and curiosity.</text>

    <!-- Bottom command -->
    <text x="50" y="278" class="mono" fill="#94a3b8" font-size="12">
      <tspan fill="#4ade80">$</tspan> code • learn • build • repeat
    </text>
  </g>

  <!-- RIGHT PANEL — Current Focus -->
  <g>
    <rect x="590" y="30" width="580" height="260" rx="10" fill="#0a1628" stroke="#1e293b" stroke-width="1" opacity="0.8"/>

    <text x="620" y="62" class="mono" fill="#e2e8f0" font-size="16" font-weight="800" letter-spacing="2">CURRENT FOCUS</text>

    <!-- Focus items -->
    <!-- Item 1 -->
    <rect x="620" y="80" width="520" height="42" rx="8" fill="url(#focusBar)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="642" cy="101" r="5" fill="#4ade80" class="dot-glow"/>
    <text x="660" y="106" class="mono" fill="#e2e8f0" font-size="13">Full Stack Development</text>

    <!-- Item 2 -->
    <rect x="620" y="130" width="520" height="42" rx="8" fill="url(#focusBar)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="642" cy="151" r="5" fill="#818cf8" class="dot-glow" style="animation-delay: 0.4s"/>
    <text x="660" y="156" class="mono" fill="#e2e8f0" font-size="13">Machine Learning &amp; AI</text>

    <!-- Item 3 -->
    <rect x="620" y="180" width="520" height="42" rx="8" fill="url(#focusBar)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="642" cy="201" r="5" fill="#d946ef" class="dot-glow" style="animation-delay: 0.8s"/>
    <text x="660" y="206" class="mono" fill="#e2e8f0" font-size="13">DevOps • Docker • K8s • Cloud</text>

    <!-- Status section -->
    <text x="620" y="248" class="mono" fill="#64748b" font-size="10" letter-spacing="2">STATUS</text>
    <rect x="620" y="256" width="520" height="28" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="0.8" opacity="0.8"/>
    <circle cx="638" cy="270" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="650" y="275" class="mono" fill="#4ade80" font-size="11" letter-spacing="1">BUILDING • LEARNING • OPEN TO COLLABORATE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="100%" style="stop-color:#071022"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>

    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1329"/>
      <stop offset="100%" style="stop-color:#0f1c3a"/>
    </linearGradient>

    <linearGradient id="focusCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#112042"/>
      <stop offset="100%" style="stop-color:#0c1630"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.4" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes dotGlow {
      0%, 100% { r: 5; opacity: 1; }
      50% { r: 7; opacity: 0.5; }
    }
    @keyframes borderSpin {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .dot-cyan { animation: dotGlow 2.5s ease-in-out infinite; }
    .dot-purple { animation: dotGlow 2.5s ease-in-out infinite 0.7s; }
    .dot-pink { animation: dotGlow 2.5s ease-in-out infinite 1.4s; }
    .border-anim { animation: borderSpin 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)" rx="14"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="14"/>

  <!-- Glowing Border -->
  <rect x="2" y="2" width="1196" height="336" rx="14" fill="none" stroke="url(#border)" stroke-width="1.6" opacity="0.75" stroke-dasharray="10 5" class="border-anim"/>

  <!-- ================= LEFT PANEL ================= -->
  <g transform="translate(30, 25)">
    <rect width="540" height="290" rx="12" fill="url(#panelBg)" stroke="#1e3a5f" stroke-width="1.2"/>
    
    <!-- Header Prompt -->
    <text x="25" y="38" class="mono" font-size="14" font-weight="700">
      <tspan fill="#ec4899">❯ </tspan><tspan fill="#00f2fe">whoami</tspan>
    </text>

    <!-- Name & Handle -->
    <text x="25" y="82" class="sans" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">ANKIT BASU</text>
    <text x="25" y="104" class="mono" fill="#00f2fe" font-size="13" font-weight="600">@Ankit-Basu</text>

    <!-- Role Titles -->
    <text x="25" y="140" class="sans" fill="#f8fafc" font-size="14.5" font-weight="800">⚡ Full Stack Developer</text>
    <text x="25" y="164" class="sans" fill="#f8fafc" font-size="14.5" font-weight="800">🤖 Machine Learning Engineer</text>
    <text x="25" y="188" class="sans" fill="#f8fafc" font-size="14.5" font-weight="800">☁️ Cloud &amp; DevOps Enthusiast</text>

    <!-- Bio -->
    <text x="25" y="222" class="mono" fill="#94a3b8" font-size="11.5">Building intelligent systems &amp; scalable</text>
    <text x="25" y="238" class="mono" fill="#94a3b8" font-size="11.5">web experiences through code and curiosity.</text>

    <!-- Terminal Command -->
    <text x="25" y="268" class="mono" fill="#cbd5e1" font-size="12.5" font-weight="600">
      <tspan fill="#4ade80">$ </tspan>code • learn • build • repeat
    </text>
  </g>

  <!-- ================= RIGHT PANEL ================= -->
  <g transform="translate(600, 25)">
    <rect width="570" height="290" rx="12" fill="url(#panelBg)" stroke="#1e3a5f" stroke-width="1.2"/>

    <!-- Section Title -->
    <text x="28" y="38" class="mono" fill="#f8fafc" font-size="16" font-weight="900" letter-spacing="2">CURRENT FOCUS</text>

    <!-- Focus Item 1 -->
    <g transform="translate(28, 54)">
      <rect width="514" height="44" rx="8" fill="url(#focusCard)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="22" cy="22" r="5" fill="#00f2fe" class="dot-cyan" filter="url(#glow)"/>
      <text x="40" y="27" class="mono" fill="#f1f5f9" font-size="13.5" font-weight="700">Full Stack Development</text>
    </g>

    <!-- Focus Item 2 -->
    <g transform="translate(28, 108)">
      <rect width="514" height="44" rx="8" fill="url(#focusCard)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="22" cy="22" r="5" fill="#a855f7" class="dot-purple" filter="url(#glow)"/>
      <text x="40" y="27" class="mono" fill="#f1f5f9" font-size="13.5" font-weight="700">Machine Learning &amp; AI</text>
    </g>

    <!-- Focus Item 3 -->
    <g transform="translate(28, 162)">
      <rect width="514" height="44" rx="8" fill="url(#focusCard)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="22" cy="22" r="5" fill="#ec4899" class="dot-pink" filter="url(#glow)"/>
      <text x="40" y="27" class="mono" fill="#f1f5f9" font-size="13.5" font-weight="700">DevOps • Docker • K8s • Cloud</text>
    </g>

    <!-- Status Box -->
    <g transform="translate(28, 222)">
      <text x="0" y="0" class="mono" fill="#64748b" font-size="10.5" font-weight="800" letter-spacing="2">STATUS</text>
      <rect x="0" y="8" width="514" height="34" rx="6" fill="#081426" stroke="#22c55e" stroke-width="1" opacity="0.9"/>
      <circle cx="20" cy="25" r="4.5" fill="#22c55e" filter="url(#glow)"/>
      <text x="35" y="29" class="mono" fill="#4ade80" font-size="12" font-weight="800" letter-spacing="1">BUILDING • LEARNING • OPEN TO COLLABORATE</text>
    </g>
  </g>
</svg>
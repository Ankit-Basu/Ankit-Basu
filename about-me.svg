<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>
    <linearGradient id="glass_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="tag_p" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#254152"/>
      <stop offset="100%" style="stop-color:#172a36"/>
    </linearGradient>

    <filter id="glowC_p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowR_p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shad_p" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    /* Breathing border-glow: offset timing per card */
    @keyframes breatheC { 0%,100% { opacity: 0.2; } 50% { opacity: 0.45; } }
    @keyframes breatheR { 0%,100% { opacity: 0.15; } 50% { opacity: 0.4; } }
    @keyframes starGlint { 0%,80%,100% { opacity: 1; } 90% { opacity: 0.3; } }

    .mono_p { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_p { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .glow-c1 { animation: breatheC 3s ease-in-out infinite; }
    .glow-r1 { animation: breatheR 3.5s ease-in-out 0.5s infinite; }
    .glow-c2 { animation: breatheC 4s ease-in-out 1s infinite; }
    .glow-r2 { animation: breatheR 3.2s ease-in-out 1.5s infinite; }
    .glow-c3 { animation: breatheC 3.8s ease-in-out 0.8s infinite; }
    .star-badge { animation: starGlint 4s ease infinite; }
    .star-badge2 { animation: starGlint 4s ease 2s infinite; }
  </style>

  <rect width="1200" height="520" fill="url(#bg_p)" rx="16"/>

  <g transform="translate(48, 32)">
    <text class="sans_p" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">PRODUCTION ARCHITECTURES</text>
    <text y="26" class="sans_p" font-size="22" font-weight="900" fill="#fbe2a7">Featured Engineering Systems</text>
  </g>

  <!-- Card 1: SUDARSHAN-X (left, wider) -->
  <g transform="translate(48, 78)">
    <rect x="-4" y="-4" width="668" height="148" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" class="glow-c1" filter="url(#glowC_p)"/>
    <rect width="660" height="140" rx="14" fill="url(#glass_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#shad_p)"/>
    <rect x="0" y="0" width="5" height="140" rx="3" fill="#fbe2a7"/>
    <g transform="translate(614, 10)" class="star-badge"><rect width="36" height="20" rx="4" fill="#fbe2a7"/><text x="18" y="14" font-size="10" text-anchor="middle" fill="#12242e" font-weight="900">&#x2605;</text></g>
    <text x="24" y="32" class="sans_p" font-size="16" font-weight="900" fill="#fbe2a7">&#x1F6F8; SUDARSHAN-X</text>
    <text x="24" y="50" class="mono_p" font-size="10" fill="#8a97a0" font-weight="600">Autonomous Drone Defense Platform</text>
    <text x="24" y="72" class="sans_p" font-size="11" fill="#f5f0e8">YOLOv8 aerial threat detection, RF spectrum analysis, Doppler tracking,</text>
    <text x="24" y="88" class="sans_p" font-size="11" fill="#f5f0e8">and Reynolds Boids 3D swarm interception.</text>
    <g transform="translate(24, 104)">
      <rect x="0" y="0" width="68" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="34" y="15" class="mono_p" font-size="9" font-weight="700" fill="#fbe2a7" text-anchor="middle">YOLOv8</text>
      <rect x="74" y="0" width="82" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="115" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Three Fiber</text>
      <rect x="162" y="0" width="70" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="197" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>
      <rect x="238" y="0" width="62" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="269" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Card 2: SheShield (right, side by side, no overlap) -->
  <g transform="translate(520, 78)">
    <rect x="-4" y="-4" width="648" height="148" rx="18" fill="none" stroke="#e4a2b1" stroke-width="4" class="glow-r1" filter="url(#glowR_p)"/>
    <rect width="640" height="140" rx="14" fill="url(#glass_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#shad_p)"/>
    <rect x="0" y="0" width="640" height="4" rx="2" fill="#e4a2b1"/>
    <g transform="translate(594, 10)" class="star-badge2"><rect width="36" height="20" rx="4" fill="#e4a2b1"/><text x="18" y="14" font-size="10" text-anchor="middle" fill="#12242e" font-weight="900">&#x2605;</text></g>
    <text x="24" y="32" class="sans_p" font-size="16" font-weight="900" fill="#e4a2b1">&#x1F6E1;&#xFE0F; SheShield Platform</text>
    <text x="24" y="50" class="mono_p" font-size="10" fill="#8a97a0" font-weight="600">Campus &amp; Personal Safety Network</text>
    <text x="24" y="72" class="sans_p" font-size="11" fill="#f5f0e8">ML-powered real-time incident heatmaps (30% drop in incidents),</text>
    <text x="24" y="88" class="sans_p" font-size="11" fill="#f5f0e8">automated escort dispatch, and 24/7 AI chatbot.</text>
    <g transform="translate(24, 104)">
      <rect x="0" y="0" width="58" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="29" y="15" class="mono_p" font-size="9" font-weight="700" fill="#e4a2b1" text-anchor="middle">React</text>
      <rect x="64" y="0" width="52" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="90" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">PHP</text>
      <rect x="122" y="0" width="62" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="153" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">MySQL</text>
      <rect x="190" y="0" width="72" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="226" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Tailwind</text>
    </g>
  </g>

  <!-- Card 3: KrishiVaani (row 2 left) -->
  <g transform="translate(48, 238)">
    <rect x="-4" y="-4" width="558" height="148" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" class="glow-c2" filter="url(#glowC_p)"/>
    <rect width="550" height="140" rx="14" fill="url(#glass_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#shad_p)"/>
    <rect x="0" y="0" width="5" height="140" rx="3" fill="#fbe2a7"/>
    <text x="24" y="32" class="sans_p" font-size="16" font-weight="900" fill="#fbe2a7">&#x1F33E; KrishiVaani</text>
    <text x="24" y="50" class="mono_p" font-size="10" fill="#8a97a0" font-weight="600">Multilingual Smart Farming Assistant</text>
    <text x="24" y="72" class="sans_p" font-size="11" fill="#f5f0e8">99.48% accuracy crop disease diagnosis via MobileNetV2, Groq LLM</text>
    <text x="24" y="88" class="sans_p" font-size="11" fill="#f5f0e8">reasoning, and real-time mandi prices with voice I/O.</text>
    <g transform="translate(24, 104)">
      <rect x="0" y="0" width="68" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="34" y="15" class="mono_p" font-size="9" font-weight="700" fill="#fbe2a7" text-anchor="middle">PyTorch</text>
      <rect x="74" y="0" width="52" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="100" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Flask</text>
      <rect x="132" y="0" width="76" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="170" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Groq LLM</text>
    </g>
  </g>

  <!-- Card 4: AlgoTrail (row 2 right) -->
  <g transform="translate(618, 238)">
    <rect x="-4" y="-4" width="548" height="148" rx="18" fill="none" stroke="#e4a2b1" stroke-width="4" class="glow-r2" filter="url(#glowR_p)"/>
    <rect width="540" height="140" rx="14" fill="url(#glass_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#shad_p)"/>
    <rect x="0" y="0" width="540" height="4" rx="2" fill="#e4a2b1"/>
    <text x="24" y="32" class="sans_p" font-size="16" font-weight="900" fill="#e4a2b1">&#x1F5FA;&#xFE0F; AlgoTrail Visualizer</text>
    <text x="24" y="50" class="mono_p" font-size="10" fill="#8a97a0" font-weight="600">Interactive Algorithm &amp; Maze Playground</text>
    <text x="24" y="72" class="sans_p" font-size="11" fill="#f5f0e8">Pathfinding visualizer with real-time maze generation, step metrics,</text>
    <text x="24" y="88" class="sans_p" font-size="11" fill="#f5f0e8">and AI-powered step explanations for intuitive learning.</text>
    <g transform="translate(24, 104)">
      <rect x="0" y="0" width="82" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="41" y="15" class="mono_p" font-size="9" font-weight="700" fill="#e4a2b1" text-anchor="middle">JavaScript</text>
      <rect x="88" y="0" width="56" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="116" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">CSS3</text>
      <rect x="150" y="0" width="92" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="196" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">AI Assistant</text>
    </g>
  </g>

  <!-- Card 5: GridSense (full width bar) -->
  <g transform="translate(48, 398)">
    <rect x="-4" y="-4" width="1118" height="84" rx="14" fill="none" stroke="#fbe2a7" stroke-width="3" class="glow-c3" filter="url(#glowC_p)"/>
    <rect width="1110" height="76" rx="12" fill="url(#glass_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#shad_p)"/>
    <rect x="0" y="0" width="5" height="76" rx="3" fill="#fbe2a7"/>
    <text x="24" y="28" class="sans_p" font-size="15" font-weight="900" fill="#fbe2a7">&#x26A1; GridSense IoT Analytics</text>
    <text x="290" y="28" class="mono_p" font-size="10" fill="#8a97a0" font-weight="600">Smart Energy &amp; Power Grid Dashboard</text>
    <text x="24" y="52" class="sans_p" font-size="11" fill="#f5f0e8">Real-time power analytics, demand forecasting, anomaly detection, and asset optimization.</text>
    <g transform="translate(800, 10)">
      <rect x="0" y="0" width="62" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="31" y="15" class="mono_p" font-size="9" font-weight="700" fill="#fbe2a7" text-anchor="middle">React</text>
      <rect x="68" y="0" width="72" height="22" rx="11" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="104" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>
      <rect x="146" y="0" width="94" height="22" rx="4" fill="url(#tag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="193" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">IoT Analytics</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d171d"/>
      <stop offset="100%" style="stop-color:#14222b"/>
    </linearGradient>

    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172732;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#101c24;stop-opacity:0.95"/>
    </linearGradient>

    <linearGradient id="focusCard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1c2d38"/>
      <stop offset="100%" style="stop-color:#142129"/>
    </linearGradient>

    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="100%" style="stop-color:#e4a7b1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dotGlow {
      0%, 100% { r: 4.5; opacity: 1; }
      50% { r: 6; opacity: 0.5; }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .dot-cream { animation: dotGlow 2.5s ease-in-out infinite; }
    .dot-rose { animation: dotGlow 2.5s ease-in-out infinite 0.8s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)" rx="18"/>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#243744" stroke-width="1.2"/>

  <!-- LEFT PANEL: WHOAMI -->
  <g transform="translate(30, 25)">
    <rect width="540" height="290" rx="14" fill="url(#panelBg)" stroke="#243744" stroke-width="1"/>
    
    <text x="25" y="38" class="mono" font-size="13" font-weight="700">
      <tspan fill="#e4a7b1">❯ </tspan><tspan fill="#fbe2a7">whoami --summary</tspan>
    </text>

    <text x="25" y="82" class="sans" fill="#ffffff" font-size="32" font-weight="900" letter-spacing="-0.5">ANKIT BASU</text>
    <text x="25" y="104" class="mono" fill="#fbe2a7" font-size="12.5" font-weight="600">@Ankit-Basu • Software Engineer &amp; Researcher</text>

    <!-- Roles -->
    <text x="25" y="140" class="sans" fill="#f8fafc" font-size="14" font-weight="800">⚡ Full Stack Development (React, Node.js, Express)</text>
    <text x="25" y="164" class="sans" fill="#f8fafc" font-size="14" font-weight="800">🤖 Autonomous AI Systems (YOLOv8, PyTorch, LLMs)</text>
    <text x="25" y="188" class="sans" fill="#f8fafc" font-size="14" font-weight="800">☁️ Cloud Native &amp; DevOps (Docker, Kubernetes, AWS)</text>

    <text x="25" y="222" class="mono" fill="#859ba8" font-size="11.5">Building high-impact systems, robust algorithms &amp; scalable</text>
    <text x="25" y="238" class="mono" fill="#859ba8" font-size="11.5">digital products with clean architecture and speed.</text>

    <text x="25" y="274" class="mono" fill="#fbe2a7" font-size="12" font-weight="700">
      <tspan fill="#e4a7b1">$ </tspan>build • learn • ship • repeat
    </text>
  </g>

  <!-- RIGHT PANEL: KEY PROJECTS -->
  <g transform="translate(600, 25)">
    <rect width="570" height="290" rx="14" fill="url(#panelBg)" stroke="#243744" stroke-width="1"/>

    <text x="28" y="38" class="mono" fill="#e4a7b1" font-size="14" font-weight="900" letter-spacing="2">FEATURED ENGINEERING SYSTEMS</text>

    <!-- Project 1 -->
    <g transform="translate(28, 52)">
      <rect width="514" height="46" rx="8" fill="url(#focusCard)" stroke="#243744" stroke-width="1"/>
      <circle cx="22" cy="23" r="4.5" fill="#fbe2a7" class="dot-cream" filter="url(#glow)"/>
      <text x="38" y="20" class="mono" fill="#ffffff" font-size="12.5" font-weight="800">Autonomous Drone Defense (SUDARSHAN-X)</text>
      <text x="38" y="36" class="mono" fill="#859ba8" font-size="10">YOLOv8 • RF Spectrum • Kalman Filters • 3D Swarm</text>
    </g>

    <!-- Project 2 -->
    <g transform="translate(28, 106)">
      <rect width="514" height="46" rx="8" fill="url(#focusCard)" stroke="#243744" stroke-width="1"/>
      <circle cx="22" cy="23" r="4.5" fill="#e4a7b1" class="dot-rose" filter="url(#glow)"/>
      <text x="38" y="20" class="mono" fill="#ffffff" font-size="12.5" font-weight="800">Campus Safety Platform (SheShield)</text>
      <text x="38" y="36" class="mono" fill="#859ba8" font-size="10">ML Heatmaps • 150+ Concerns • 24/7 AI Chatbot</text>
    </g>

    <!-- Project 3 -->
    <g transform="translate(28, 160)">
      <rect width="514" height="46" rx="8" fill="url(#focusCard)" stroke="#243744" stroke-width="1"/>
      <circle cx="22" cy="23" r="4.5" fill="#fbe2a7" class="dot-cream" filter="url(#glow)"/>
      <text x="38" y="20" class="mono" fill="#ffffff" font-size="12.5" font-weight="800">Multilingual Smart Farming (KrishiVaani)</text>
      <text x="38" y="36" class="mono" fill="#859ba8" font-size="10">99.48% Accuracy • MobileNetV2 • Gemini Reasoning</text>
    </g>

    <!-- Status Box -->
    <g transform="translate(28, 222)">
      <rect width="514" height="34" rx="8" fill="#0d171d" stroke="#fbe2a7" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#fbe2a7"/>
      <text x="32" y="21" class="mono" fill="#fbe2a7" font-size="11.5" font-weight="800" letter-spacing="1">BUILDING • LEARNING • OPEN TO COLLABORATE</text>
    </g>
  </g>
</svg>
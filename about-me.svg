<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
  <defs>
    <linearGradient id="bgGrad_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassCard_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.7"/>
    </linearGradient>

    <linearGradient id="skeuoTag_p" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#254152"/>
      <stop offset="100%" style="stop-color:#172a36"/>
    </linearGradient>

    <filter id="glowCream_p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowRose_p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="cardShadow_p" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Grain overlay -->
    <filter id="grain_p" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
  </defs>

  <style>
    .mono_p { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_p { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="580" fill="url(#bgGrad_p)" rx="16"/>

  <!-- Section Header -->
  <g transform="translate(48, 36)">
    <text class="sans_p" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">PRODUCTION ARCHITECTURES</text>
    <text y="26" class="sans_p" font-size="22" font-weight="900" fill="#fbe2a7">Featured Engineering Systems</text>
  </g>

  <!-- ====== CARD 1: SUDARSHAN-X — LEFT ACCENT STRIPE, widest top card ====== -->
  <g transform="translate(48, 82)">
    <rect x="-4" y="-4" width="668" height="158" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" opacity="0.25" filter="url(#glowCream_p)"/>
    <rect width="660" height="150" rx="14" fill="url(#glassCard_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow_p)"/>
    <rect x="0" y="0" width="5" height="150" rx="3" fill="#fbe2a7"/>

    <!-- Pinned star badge -->
    <g transform="translate(614, 12)">
      <rect width="36" height="20" rx="4" fill="#fbe2a7"/>
      <text x="18" y="14" font-size="10" text-anchor="middle" fill="#12242e" font-weight="900">&#x2605;</text>
    </g>

    <text x="24" y="36" class="sans_p" font-size="17" font-weight="900" fill="#fbe2a7">&#x1F6F8; SUDARSHAN-X</text>
    <text x="24" y="54" class="mono_p" font-size="10.5" fill="#8a97a0" font-weight="600">Autonomous Drone Defense Platform</text>
    <text x="24" y="78" class="sans_p" font-size="11.5" fill="#f5f0e8">YOLOv8 aerial threat detection, RF spectrum analysis, Doppler</text>
    <text x="24" y="94" class="sans_p" font-size="11.5" fill="#f5f0e8">tracking, and Reynolds Boids 3D swarm interception.</text>
    <g transform="translate(24, 114)">
      <rect x="0" y="0" width="68" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="34" y="15" class="mono_p" font-size="9" font-weight="700" fill="#fbe2a7" text-anchor="middle">YOLOv8</text>
      <rect x="74" y="0" width="82" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="115" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Three Fiber</text>
      <rect x="162" y="0" width="70" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="197" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>
      <rect x="238" y="0" width="62" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="269" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- ====== CARD 2: SheShield — TOP ACCENT BAR, offset right, NO overlap with Card 1 tags ====== -->
  <g transform="translate(520, 82)">
    <rect x="-4" y="-4" width="648" height="158" rx="18" fill="none" stroke="#e4a2b1" stroke-width="4" opacity="0.2" filter="url(#glowRose_p)"/>
    <rect width="640" height="150" rx="14" fill="url(#glassCard_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow_p)"/>
    <rect x="0" y="0" width="640" height="4" rx="2" fill="#e4a2b1"/>

    <!-- Pinned star badge -->
    <g transform="translate(594, 12)">
      <rect width="36" height="20" rx="4" fill="#e4a2b1"/>
      <text x="18" y="14" font-size="10" text-anchor="middle" fill="#12242e" font-weight="900">&#x2605;</text>
    </g>

    <text x="24" y="36" class="sans_p" font-size="17" font-weight="900" fill="#e4a2b1">&#x1F6E1;&#xFE0F; SheShield Platform</text>
    <text x="24" y="54" class="mono_p" font-size="10.5" fill="#8a97a0" font-weight="600">Campus &amp; Personal Safety Network</text>
    <text x="24" y="78" class="sans_p" font-size="11.5" fill="#f5f0e8">ML-powered real-time incident heatmaps (30% drop in incidents),</text>
    <text x="24" y="94" class="sans_p" font-size="11.5" fill="#f5f0e8">automated escort dispatch, and 24/7 AI chatbot.</text>
    <g transform="translate(24, 114)">
      <rect x="0" y="0" width="58" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="29" y="15" class="mono_p" font-size="9" font-weight="700" fill="#e4a2b1" text-anchor="middle">React</text>
      <rect x="64" y="0" width="52" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="90" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">PHP</text>
      <rect x="122" y="0" width="62" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="153" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">MySQL</text>
      <rect x="190" y="0" width="72" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="226" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Tailwind</text>
    </g>
  </g>

  <!-- ====== CARD 3: KrishiVaani — LEFT ACCENT STRIPE, row 2 left ====== -->
  <g transform="translate(48, 252)">
    <rect x="-4" y="-4" width="558" height="158" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" opacity="0.2" filter="url(#glowCream_p)"/>
    <rect width="550" height="150" rx="14" fill="url(#glassCard_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow_p)"/>
    <rect x="0" y="0" width="5" height="150" rx="3" fill="#fbe2a7"/>
    <text x="24" y="34" class="sans_p" font-size="17" font-weight="900" fill="#fbe2a7">&#x1F33E; KrishiVaani</text>
    <text x="24" y="52" class="mono_p" font-size="10.5" fill="#8a97a0" font-weight="600">Multilingual Smart Farming Assistant</text>
    <text x="24" y="76" class="sans_p" font-size="11.5" fill="#f5f0e8">99.48% accuracy crop disease diagnosis via MobileNetV2, Groq LLM</text>
    <text x="24" y="92" class="sans_p" font-size="11.5" fill="#f5f0e8">reasoning, and real-time mandi prices with voice I/O.</text>
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="68" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="34" y="15" class="mono_p" font-size="9" font-weight="700" fill="#fbe2a7" text-anchor="middle">PyTorch</text>
      <rect x="74" y="0" width="52" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="100" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Flask</text>
      <rect x="132" y="0" width="76" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="170" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Groq LLM</text>
      <rect x="214" y="0" width="76" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="252" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">MobileNet</text>
    </g>
  </g>

  <!-- ====== CARD 4: AlgoTrail — TOP ACCENT BAR, row 2 right ====== -->
  <g transform="translate(618, 252)">
    <rect x="-4" y="-4" width="548" height="158" rx="18" fill="none" stroke="#e4a2b1" stroke-width="4" opacity="0.2" filter="url(#glowRose_p)"/>
    <rect width="540" height="150" rx="14" fill="url(#glassCard_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow_p)"/>
    <rect x="0" y="0" width="540" height="4" rx="2" fill="#e4a2b1"/>
    <text x="24" y="34" class="sans_p" font-size="17" font-weight="900" fill="#e4a2b1">&#x1F5FA;&#xFE0F; AlgoTrail Visualizer</text>
    <text x="24" y="52" class="mono_p" font-size="10.5" fill="#8a97a0" font-weight="600">Interactive Algorithm &amp; Maze Playground</text>
    <text x="24" y="76" class="sans_p" font-size="11.5" fill="#f5f0e8">Pathfinding visualizer with real-time maze generation animations,</text>
    <text x="24" y="92" class="sans_p" font-size="11.5" fill="#f5f0e8">step metrics, and AI-powered step explanations.</text>
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="82" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="41" y="15" class="mono_p" font-size="9" font-weight="700" fill="#e4a2b1" text-anchor="middle">JavaScript</text>
      <rect x="88" y="0" width="56" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="116" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">CSS3</text>
      <rect x="150" y="0" width="92" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="196" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">AI Assistant</text>
    </g>
  </g>

  <!-- ====== CARD 5: GridSense — FULL WIDTH FOOTER BAR, LEFT STRIPE ====== -->
  <g transform="translate(48, 422)">
    <rect x="-4" y="-4" width="1118" height="84" rx="14" fill="none" stroke="#fbe2a7" stroke-width="3" opacity="0.15" filter="url(#glowCream_p)"/>
    <rect width="1110" height="76" rx="12" fill="url(#glassCard_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow_p)"/>
    <rect x="0" y="0" width="5" height="76" rx="3" fill="#fbe2a7"/>
    <text x="24" y="30" class="sans_p" font-size="15" font-weight="900" fill="#fbe2a7">&#x26A1; GridSense IoT Analytics</text>
    <text x="290" y="30" class="mono_p" font-size="10.5" fill="#8a97a0" font-weight="600">Smart Energy &amp; Power Grid Dashboard</text>
    <text x="24" y="54" class="sans_p" font-size="11.5" fill="#f5f0e8">Smart energy grid monitoring for real-time power analytics, demand forecasting, anomaly detection, and asset optimization.</text>
    <g transform="translate(800, 14)">
      <rect x="0" y="0" width="62" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="31" y="15" class="mono_p" font-size="9" font-weight="700" fill="#fbe2a7" text-anchor="middle">React</text>
      <rect x="68" y="0" width="72" height="22" rx="11" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="104" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>
      <rect x="146" y="0" width="94" height="22" rx="4" fill="url(#skeuoTag_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="193" y="15" class="mono_p" font-size="9" font-weight="700" fill="#f5f0e8" text-anchor="middle">IoT Analytics</text>
    </g>
  </g>
</svg>
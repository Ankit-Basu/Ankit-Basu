<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.75"/>
    </linearGradient>

    <linearGradient id="skeuoTag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#254152"/>
      <stop offset="100%" style="stop-color:#172a36"/>
    </linearGradient>

    <!-- Border Glow Filters for Tilted Cards -->
    <filter id="creamBorderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="roseBorderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <text class="sans" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">PRODUCTION ARCHITECTURES</text>
    <text y="28" class="sans" font-size="24" font-weight="900" fill="#fbe2a7">Featured Engineering Systems</text>
  </g>

  <!-- ================= ROW 1 (3 Tilted Stack Cards with Border Glow) ================= -->
  <!-- Project 1: SUDARSHAN-X (Featured / Pinned with Cream Border Glow & -1.5deg Tilt) -->
  <g transform="translate(48, 88) rotate(-1.5, 175, 95)">
    <!-- Blurred Border Glow Shape Behind -->
    <rect x="-3" y="-3" width="356" height="196" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" opacity="0.35" filter="url(#creamBorderGlow)"/>
    <rect width="350" height="190" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>
    
    <text x="20" y="32" class="sans" font-size="16" font-weight="800" fill="#fbe2a7">🛸 SUDARSHAN-X</text>
    <text x="20" y="48" class="mono" font-size="10" font-weight="600" fill="#8a97a0">Autonomous Drone Defense Platform</text>

    <text x="20" y="74" class="sans" font-size="11.5" font-weight="400" fill="#f5f0e8">
      YOLOv8 aerial threat detection, RF spectrum analysis, Doppler tracking, and Reynolds Boids 3D swarm interception.
    </text>

    <!-- Skeuomorphic Tags -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="70" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="35" y="16" class="mono" font-size="9.5" font-weight="700" fill="#fbe2a7" text-anchor="middle">YOLOv8</text>

      <rect x="76" y="0" width="90" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="121" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Three Fiber</text>

      <rect x="172" y="0" width="74" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="209" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>

      <rect x="252" y="0" width="56" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="280" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Project 2: SheShield (Rose Border Glow with +1.5deg Tilt) -->
  <g transform="translate(425, 88) rotate(1.5, 175, 95)">
    <!-- Blurred Rose Glow Shape Behind -->
    <rect x="-3" y="-3" width="356" height="196" rx="18" fill="none" stroke="#e4a2b1" stroke-width="4" opacity="0.3" filter="url(#roseBorderGlow)"/>
    <rect width="350" height="190" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>
    
    <text x="20" y="32" class="sans" font-size="16" font-weight="800" fill="#e4a2b1">🛡️ SheShield Platform</text>
    <text x="20" y="48" class="mono" font-size="10" font-weight="600" fill="#8a97a0">Campus &amp; Personal Safety Network</text>

    <text x="20" y="74" class="sans" font-size="11.5" font-weight="400" fill="#f5f0e8">
      ML-powered real-time incident heatmaps (30% drop in incidents), automated escort dispatch, and 24/7 AI chatbot.
    </text>

    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="30" y="16" class="mono" font-size="9.5" font-weight="700" fill="#e4a2b1" text-anchor="middle">React</text>

      <rect x="66" y="0" width="54" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="93" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">PHP</text>

      <rect x="126" y="0" width="66" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="159" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">MySQL</text>

      <rect x="198" y="0" width="76" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="236" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Tailwind</text>
    </g>
  </g>

  <!-- Project 3: KrishiVaani (Cream Border Glow with -1deg Tilt) -->
  <g transform="translate(802, 88) rotate(-1, 175, 95)">
    <!-- Blurred Cream Glow Shape Behind -->
    <rect x="-3" y="-3" width="356" height="196" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" opacity="0.3" filter="url(#creamBorderGlow)"/>
    <rect width="350" height="190" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>
    
    <text x="20" y="32" class="sans" font-size="16" font-weight="800" fill="#fbe2a7">🌾 KrishiVaani</text>
    <text x="20" y="48" class="mono" font-size="10" font-weight="600" fill="#8a97a0">Multilingual Smart Farming Assistant</text>

    <text x="20" y="74" class="sans" font-size="11.5" font-weight="400" fill="#f5f0e8">
      99.48% accuracy crop disease diagnosis via MobileNetV2, Groq LLM reasoning, and real-time mandi prices with voice I/O.
    </text>

    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="72" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="36" y="16" class="mono" font-size="9.5" font-weight="700" fill="#fbe2a7" text-anchor="middle">PyTorch</text>

      <rect x="78" y="0" width="56" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="106" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Flask</text>

      <rect x="140" y="0" width="78" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="179" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Groq LLM</text>

      <rect x="224" y="0" width="74" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="261" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">MobileNet</text>
    </g>
  </g>

  <!-- ================= ROW 2 (2 Tilted Stack Cards) ================= -->
  <!-- Project 4: AlgoTrail (Rose Glow with +1deg Tilt) -->
  <g transform="translate(48, 305) rotate(1, 269, 92)">
    <rect x="-3" y="-3" width="544" height="191" rx="18" fill="none" stroke="#e4a2b1" stroke-width="4" opacity="0.3" filter="url(#roseBorderGlow)"/>
    <rect width="538" height="185" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>
    
    <text x="24" y="32" class="sans" font-size="16" font-weight="800" fill="#e4a2b1">🗺️ AlgoTrail Visualizer</text>
    <text x="24" y="48" class="mono" font-size="10" font-weight="600" fill="#8a97a0">Interactive Algorithm &amp; Maze Playground</text>

    <text x="24" y="74" class="sans" font-size="11.5" font-weight="400" fill="#f5f0e8">
      Pathfinding visualizer with real-time maze generation animations, step metrics, and AI-powered step explanations for intuitive learning.
    </text>

    <g transform="translate(24, 138)">
      <rect x="0" y="0" width="86" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="43" y="16" class="mono" font-size="9.5" font-weight="700" fill="#e4a2b1" text-anchor="middle">JavaScript</text>

      <rect x="94" y="0" width="60" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="124" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">CSS3</text>

      <rect x="160" y="0" width="100" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="210" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">AI Assistant</text>

      <rect x="266" y="0" width="80" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="306" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Algorithms</text>
    </g>
  </g>

  <!-- Project 5: GridSense (Cream Glow with -1deg Tilt) -->
  <g transform="translate(614, 305) rotate(-1, 269, 92)">
    <rect x="-3" y="-3" width="544" height="191" rx="18" fill="none" stroke="#fbe2a7" stroke-width="4" opacity="0.3" filter="url(#creamBorderGlow)"/>
    <rect width="538" height="185" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>
    
    <text x="24" y="32" class="sans" font-size="16" font-weight="800" fill="#fbe2a7">⚡ GridSense IoT Analytics</text>
    <text x="24" y="48" class="mono" font-size="10" font-weight="600" fill="#8a97a0">Smart Energy &amp; Power Grid Dashboard</text>

    <text x="24" y="74" class="sans" font-size="11.5" font-weight="400" fill="#f5f0e8">
      Smart energy grid monitoring dashboard for real-time power analytics, demand forecasting, anomaly detection, and asset optimization.
    </text>

    <g transform="translate(24, 138)">
      <rect x="0" y="0" width="86" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="43" y="16" class="mono" font-size="9.5" font-weight="700" fill="#fbe2a7" text-anchor="middle">JavaScript</text>

      <rect x="94" y="0" width="60" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="124" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">React</text>

      <rect x="160" y="0" width="76" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="198" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>

      <rect x="242" y="0" width="104" height="24" rx="6" fill="url(#skeuoTag)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="294" y="16" class="mono" font-size="9.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">IoT Analytics</text>
    </g>
  </g>
</svg>
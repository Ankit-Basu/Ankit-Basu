<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490">
  <defs>
    <linearGradient id="bg_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/><stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>
    <linearGradient id="gl_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.55"/><stop offset="100%" style="stop-color:#142732;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="tg_p" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#254152"/><stop offset="100%" style="stop-color:#172a36"/>
    </linearGradient>
    <filter id="gC_p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gR_p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh_p" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes breatheA { 0%,100% { opacity: 0.15; } 50% { opacity: 0.4; } }
    @keyframes breatheB { 0%,100% { opacity: 0.12; } 50% { opacity: 0.35; } }
    @keyframes starPulse { 0%,80%,100% { opacity: 1; } 90% { opacity: 0.3; } }
    .mono_p { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_p { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .bA1 { animation: breatheA 3s ease-in-out infinite; }
    .bB1 { animation: breatheB 3.5s ease-in-out 0.6s infinite; }
    .bA2 { animation: breatheA 4s ease-in-out 1.2s infinite; }
    .bB2 { animation: breatheB 3.3s ease-in-out 1.8s infinite; }
    .bA3 { animation: breatheA 3.6s ease-in-out 0.4s infinite; }
    .star1 { animation: starPulse 4s ease infinite; }
    .star2 { animation: starPulse 4s ease 2s infinite; }
  </style>

  <rect width="1200" height="490" fill="url(#bg_p)" rx="16"/>

  <text x="48" y="36" class="sans_p" font-size="11" font-weight="600" fill="#8a97a0" letter-spacing="2">PRODUCTION ARCHITECTURES</text>
  <text x="48" y="58" class="sans_p" font-size="20" font-weight="900" fill="#fbe2a7">Featured Engineering Systems</text>

  <!-- ROW 1: 2 cards, no overlap -->
  <!-- Card 1: SUDARSHAN-X (x=48, w=540) -->
  <g transform="translate(48, 76)">
    <rect x="-3" y="-3" width="546" height="136" rx="16" fill="none" stroke="#fbe2a7" stroke-width="3" class="bA1" filter="url(#gC_p)"/>
    <rect width="540" height="130" rx="14" fill="url(#gl_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#sh_p)"/>
    <rect width="4" height="130" rx="2" fill="#fbe2a7"/>
    <g transform="translate(498, 8)" class="star1"><rect width="32" height="18" rx="4" fill="#fbe2a7"/><text x="16" y="13" font-size="9" text-anchor="middle" fill="#12242e" font-weight="900">&#x2605;</text></g>
    <text x="20" y="28" class="sans_p" font-size="14" font-weight="900" fill="#fbe2a7">&#x1F6F8; SUDARSHAN-X</text>
    <text x="20" y="44" class="mono_p" font-size="9.5" fill="#8a97a0" font-weight="600">Autonomous Drone Defense Platform</text>
    <text x="20" y="64" class="sans_p" font-size="10.5" fill="#f5f0e8">YOLOv8 aerial threat detection, RF spectrum analysis,</text>
    <text x="20" y="78" class="sans_p" font-size="10.5" fill="#f5f0e8">Doppler tracking, Reynolds Boids 3D swarm interception.</text>
    <g transform="translate(20, 94)">
      <rect x="0" y="0" width="62" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="31" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#fbe2a7" text-anchor="middle">YOLOv8</text>
      <rect x="68" y="0" width="76" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="106" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Three Fiber</text>
      <rect x="150" y="0" width="62" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="181" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>
      <rect x="218" y="0" width="56" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="246" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- Card 2: SheShield (x=612, w=540) — NO overlap with Card 1 -->
  <g transform="translate(612, 76)">
    <rect x="-3" y="-3" width="546" height="136" rx="16" fill="none" stroke="#e4a2b1" stroke-width="3" class="bB1" filter="url(#gR_p)"/>
    <rect width="540" height="130" rx="14" fill="url(#gl_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#sh_p)"/>
    <rect width="540" height="4" rx="2" fill="#e4a2b1"/>
    <g transform="translate(498, 8)" class="star2"><rect width="32" height="18" rx="4" fill="#e4a2b1"/><text x="16" y="13" font-size="9" text-anchor="middle" fill="#12242e" font-weight="900">&#x2605;</text></g>
    <text x="20" y="28" class="sans_p" font-size="14" font-weight="900" fill="#e4a2b1">&#x1F6E1;&#xFE0F; SheShield Platform</text>
    <text x="20" y="44" class="mono_p" font-size="9.5" fill="#8a97a0" font-weight="600">Campus &amp; Personal Safety Network</text>
    <text x="20" y="64" class="sans_p" font-size="10.5" fill="#f5f0e8">ML-powered real-time incident heatmaps (30% drop),</text>
    <text x="20" y="78" class="sans_p" font-size="10.5" fill="#f5f0e8">automated escort dispatch, and 24/7 AI chatbot.</text>
    <g transform="translate(20, 94)">
      <rect x="0" y="0" width="52" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="26" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#e4a2b1" text-anchor="middle">React</text>
      <rect x="58" y="0" width="42" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="79" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">PHP</text>
      <rect x="106" y="0" width="56" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="134" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">MySQL</text>
      <rect x="168" y="0" width="66" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="201" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Tailwind</text>
    </g>
  </g>

  <!-- ROW 2 -->
  <!-- Card 3: KrishiVaani (x=48, w=540) -->
  <g transform="translate(48, 228)">
    <rect x="-3" y="-3" width="546" height="136" rx="16" fill="none" stroke="#fbe2a7" stroke-width="3" class="bA2" filter="url(#gC_p)"/>
    <rect width="540" height="130" rx="14" fill="url(#gl_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#sh_p)"/>
    <rect width="4" height="130" rx="2" fill="#fbe2a7"/>
    <text x="20" y="28" class="sans_p" font-size="14" font-weight="900" fill="#fbe2a7">&#x1F33E; KrishiVaani</text>
    <text x="20" y="44" class="mono_p" font-size="9.5" fill="#8a97a0" font-weight="600">Multilingual Smart Farming Assistant</text>
    <text x="20" y="64" class="sans_p" font-size="10.5" fill="#f5f0e8">99.48% crop disease diagnosis via MobileNetV2, Groq</text>
    <text x="20" y="78" class="sans_p" font-size="10.5" fill="#f5f0e8">LLM reasoning, real-time mandi prices + voice I/O.</text>
    <g transform="translate(20, 94)">
      <rect x="0" y="0" width="62" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="31" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#fbe2a7" text-anchor="middle">PyTorch</text>
      <rect x="68" y="0" width="48" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="92" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Flask</text>
      <rect x="122" y="0" width="72" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="158" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Groq LLM</text>
    </g>
  </g>

  <!-- Card 4: AlgoTrail (x=612, w=540) -->
  <g transform="translate(612, 228)">
    <rect x="-3" y="-3" width="546" height="136" rx="16" fill="none" stroke="#e4a2b1" stroke-width="3" class="bB2" filter="url(#gR_p)"/>
    <rect width="540" height="130" rx="14" fill="url(#gl_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#sh_p)"/>
    <rect width="540" height="4" rx="2" fill="#e4a2b1"/>
    <text x="20" y="28" class="sans_p" font-size="14" font-weight="900" fill="#e4a2b1">&#x1F5FA;&#xFE0F; AlgoTrail Visualizer</text>
    <text x="20" y="44" class="mono_p" font-size="9.5" fill="#8a97a0" font-weight="600">Interactive Algorithm &amp; Maze Playground</text>
    <text x="20" y="64" class="sans_p" font-size="10.5" fill="#f5f0e8">Pathfinding visualizer with real-time maze generation,</text>
    <text x="20" y="78" class="sans_p" font-size="10.5" fill="#f5f0e8">step metrics, AI-powered step explanations.</text>
    <g transform="translate(20, 94)">
      <rect x="0" y="0" width="76" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="38" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#e4a2b1" text-anchor="middle">JavaScript</text>
      <rect x="82" y="0" width="48" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="106" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">CSS3</text>
      <rect x="136" y="0" width="84" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="178" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">AI Assistant</text>
    </g>
  </g>

  <!-- Card 5: GridSense (full width bar) -->
  <g transform="translate(48, 380)">
    <rect x="-3" y="-3" width="1110" height="74" rx="14" fill="none" stroke="#fbe2a7" stroke-width="3" class="bA3" filter="url(#gC_p)"/>
    <rect width="1104" height="68" rx="12" fill="url(#gl_p)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#sh_p)"/>
    <rect width="4" height="68" rx="2" fill="#fbe2a7"/>
    <text x="20" y="26" class="sans_p" font-size="14" font-weight="900" fill="#fbe2a7">&#x26A1; GridSense IoT Analytics</text>
    <text x="270" y="26" class="mono_p" font-size="9.5" fill="#8a97a0" font-weight="600">Smart Energy &amp; Power Grid Dashboard</text>
    <text x="20" y="48" class="sans_p" font-size="10.5" fill="#f5f0e8">Real-time power analytics, demand forecasting, anomaly detection, and asset optimization.</text>
    <g transform="translate(800, 8)">
      <rect x="0" y="0" width="52" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="26" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#fbe2a7" text-anchor="middle">React</text>
      <rect x="58" y="0" width="62" height="20" rx="10" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="89" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">Node.js</text>
      <rect x="126" y="0" width="82" height="20" rx="4" fill="url(#tg_p)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/><text x="167" y="14" class="mono_p" font-size="8.5" font-weight="700" fill="#f5f0e8" text-anchor="middle">IoT Analytics</text>
    </g>
  </g>
</svg>
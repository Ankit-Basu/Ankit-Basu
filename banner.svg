<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#07101f"/>
      <stop offset="100%" style="stop-color:#0c1929"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="codeBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="photoFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="33%" style="stop-color:#a78bfa"/>
      <stop offset="66%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#67e8f9" stroke-width="0.3" opacity="0.03"/>
    </pattern>
  </defs>

  <style>
    @keyframes typing {
      0%, 100% { width: 0; }
      20%, 80% { width: 265px; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 3px #67e8f9); }
      50% { filter: drop-shadow(0 0 8px #67e8f9); }
    }
    @keyframes borderRotate {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    @keyframes dotBlink {
      0%, 100% { fill: #22c55e; }
      50% { fill: #4ade80; filter: drop-shadow(0 0 4px #22c55e); }
    }

    .terminal-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .display-text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }

    .typing-text {
      animation: typing 4s steps(22) infinite;
      overflow: hidden;
      white-space: nowrap;
    }
    .cursor {
      animation: blink 0.8s step-end infinite;
    }
    .fade-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    .pulse-anim {
      animation: pulse 2s ease-in-out infinite;
    }
    .glow-pulse {
      animation: glowPulse 3s ease-in-out infinite;
    }
    .border-anim {
      animation: borderRotate 20s linear infinite;
    }
    .dot-blink {
      animation: dotBlink 2s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="12"/>
  <rect width="1200" height="400" fill="url(#grid)" rx="12" opacity="0.5"/>
  <rect width="1200" height="400" fill="url(#scanlines)" rx="12"/>

  <!-- Animated border -->
  <rect x="2" y="2" width="1196" height="396" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.7" stroke-dasharray="8 4" class="border-anim"/>

  <!-- Decorative corner accents -->
  <path d="M 12 2 L 2 2 L 2 12" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.8"/>
  <path d="M 1188 2 L 1198 2 L 1198 12" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.8"/>
  <path d="M 2 388 L 2 398 L 12 398" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.8"/>
  <path d="M 1198 388 L 1198 398 L 1188 398" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.8"/>

  <!-- Left Content Area -->
  <!-- Terminal header -->
  <text x="40" y="45" class="terminal-text" fill="#67e8f9" font-size="13" opacity="0.9" filter="url(#textGlow)">ankit@developer:~$ cat README.md</text>

  <!-- Name Section -->
  <text x="40" y="90" class="display-text" fill="#94a3b8" font-size="18" font-weight="400">Hi, I'm</text>
  <text x="40" y="145" class="display-text" fill="url(#nameGrad)" font-size="58" font-weight="900" letter-spacing="-1" filter="url(#textGlow)">ANKIT BASU</text>
  <text x="40" y="175" class="terminal-text" fill="#94a3b8" font-size="14">Full Stack • Machine Learning • DevOps</text>

  <!-- Current Mode Box -->
  <rect x="40" y="195" width="380" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="55" y="215" class="terminal-text" fill="#64748b" font-size="10" text-transform="uppercase" letter-spacing="2">CURRENT MODE</text>
  <text x="55" y="235" class="terminal-text" fill="#67e8f9" font-size="14">
    <tspan fill="#d946ef">❯ </tspan>FullStackDeveloper</text>
  <!-- Blinking cursor -->
  <rect x="244" y="223" width="8" height="16" fill="#67e8f9" class="cursor" opacity="0.8"/>

  <!-- Tech Stack -->
  <text x="40" y="275" class="terminal-text" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="2">TECH STACK</text>

  <!-- Tech pills -->
  <g class="fade-in">
    <rect x="40" y="285" width="56" height="26" rx="6" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.6"/>
    <text x="68" y="303" class="terminal-text" fill="#67e8f9" font-size="10" text-anchor="middle">JAVA</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.1s">
    <rect x="106" y="285" width="68" height="26" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
    <text x="140" y="303" class="terminal-text" fill="#a78bfa" font-size="10" text-anchor="middle">PYTHON</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.2s">
    <rect x="184" y="285" width="60" height="26" rx="6" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.6"/>
    <text x="214" y="303" class="terminal-text" fill="#67e8f9" font-size="10" text-anchor="middle">REACT</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.3s">
    <rect x="254" y="285" width="72" height="26" rx="6" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.6"/>
    <text x="290" y="303" class="terminal-text" fill="#d946ef" font-size="10" text-anchor="middle">NODE.JS</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.4s">
    <rect x="336" y="285" width="76" height="26" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
    <text x="374" y="303" class="terminal-text" fill="#a78bfa" font-size="10" text-anchor="middle">MONGODB</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.5s">
    <rect x="40" y="318" width="68" height="26" rx="6" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.6"/>
    <text x="74" y="336" class="terminal-text" fill="#67e8f9" font-size="10" text-anchor="middle">DOCKER</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.6s">
    <rect x="118" y="318" width="44" height="26" rx="6" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.6"/>
    <text x="140" y="336" class="terminal-text" fill="#d946ef" font-size="10" text-anchor="middle">AWS</text>
  </g>
  <g class="fade-in" style="animation-delay: 0.7s">
    <rect x="172" y="318" width="60" height="26" rx="6" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
    <text x="202" y="336" class="terminal-text" fill="#a78bfa" font-size="10" text-anchor="middle">GENAI</text>
  </g>

  <!-- Code Snippet Box -->
  <rect x="40" y="355" width="380" height="35" rx="6" fill="url(#codeBoxGrad)" stroke="#1e293b" stroke-width="1" opacity="0.9"/>
  <text x="55" y="377" class="terminal-text" font-size="11">
    <tspan fill="#c084fc">const</tspan>
    <tspan fill="#67e8f9"> ankit</tspan>
    <tspan fill="#94a3b8"> = { </tspan>
    <tspan fill="#a78bfa">focus</tspan>
    <tspan fill="#94a3b8">: </tspan>
    <tspan fill="#4ade80">"Build • Learn • Ship"</tspan>
    <tspan fill="#94a3b8"> };</tspan>
  </text>

  <!-- Right side — Decorative Photo Frame Area -->
  <!-- Outer glow frame -->
  <rect x="720" y="30" width="440" height="340" rx="16" fill="none" stroke="url(#photoFrameGrad)" stroke-width="2" opacity="0.4" class="glow-pulse"/>

  <!-- Inner dark card -->
  <rect x="730" y="40" width="420" height="320" rx="12" fill="#0a1628" opacity="0.8"/>

  <!-- Top-right badge -->
  <rect x="880" y="52" width="170" height="30" rx="15" fill="url(#badgeGrad)" opacity="0.9"/>
  <text x="965" y="72" class="terminal-text" fill="#fff" font-size="11" text-anchor="middle" font-weight="600">CODE • LEARN • BUILD</text>

  <!-- Large stylized initials -->
  <circle cx="940" cy="190" r="80" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="940" cy="190" r="60" fill="#0f172a" stroke="#67e8f9" stroke-width="1.5" opacity="0.6"/>
  <text x="940" y="205" class="display-text" fill="url(#nameGrad)" font-size="48" font-weight="900" text-anchor="middle" filter="url(#textGlow)">AB</text>

  <!-- Decorative elements around initials -->
  <circle cx="870" cy="130" r="3" fill="#d946ef" opacity="0.6" class="pulse-anim"/>
  <circle cx="1010" cy="130" r="3" fill="#67e8f9" opacity="0.6" class="pulse-anim" style="animation-delay: 0.5s"/>
  <circle cx="870" cy="250" r="3" fill="#a78bfa" opacity="0.6" class="pulse-anim" style="animation-delay: 1s"/>
  <circle cx="1010" cy="250" r="3" fill="#d946ef" opacity="0.6" class="pulse-anim" style="animation-delay: 1.5s"/>

  <!-- Floating tech labels around photo -->
  <g opacity="0.5">
    <rect x="750" y="100" width="70" height="22" rx="4" fill="#0f172a" stroke="#67e8f9" stroke-width="0.5"/>
    <text x="785" y="115" class="terminal-text" fill="#67e8f9" font-size="9" text-anchor="middle">React</text>
  </g>
  <g opacity="0.5">
    <rect x="1060" y="140" width="70" height="22" rx="4" fill="#0f172a" stroke="#d946ef" stroke-width="0.5"/>
    <text x="1095" y="155" class="terminal-text" fill="#d946ef" font-size="9" text-anchor="middle">Docker</text>
  </g>
  <g opacity="0.5">
    <rect x="750" y="220" width="70" height="22" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="0.5"/>
    <text x="785" y="235" class="terminal-text" fill="#a78bfa" font-size="9" text-anchor="middle">Python</text>
  </g>
  <g opacity="0.5">
    <rect x="1060" y="220" width="70" height="22" rx="4" fill="#0f172a" stroke="#67e8f9" stroke-width="0.5"/>
    <text x="1095" y="235" class="terminal-text" fill="#67e8f9" font-size="9" text-anchor="middle">Node.js</text>
  </g>
  <g opacity="0.5">
    <rect x="750" y="160" width="70" height="22" rx="4" fill="#0f172a" stroke="#d946ef" stroke-width="0.5"/>
    <text x="785" y="175" class="terminal-text" fill="#d946ef" font-size="9" text-anchor="middle">Java</text>
  </g>
  <g opacity="0.5">
    <rect x="1060" y="180" width="70" height="22" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="0.5"/>
    <text x="1095" y="195" class="terminal-text" fill="#a78bfa" font-size="9" text-anchor="middle">AWS</text>
  </g>

  <!-- Decorative connection lines -->
  <line x1="820" y1="111" x2="880" y2="150" stroke="#67e8f9" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="1060" y1="151" x2="1000" y2="170" stroke="#d946ef" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="820" y1="231" x2="880" y2="220" stroke="#a78bfa" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="1060" y1="231" x2="1000" y2="210" stroke="#67e8f9" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- Bottom status bar -->
  <g>
    <circle cx="760" cy="330" r="4" fill="#22c55e" class="dot-blink"/>
    <text x="772" y="334" class="terminal-text" fill="#4ade80" font-size="11">open to collaborate</text>
    <text x="920" y="334" class="terminal-text" fill="#64748b" font-size="11">github.com/Ankit-Basu</text>
  </g>

  <!-- Subtle decorative dots -->
  <g opacity="0.15">
    <circle cx="500" cy="50" r="1.5" fill="#67e8f9"/>
    <circle cx="520" cy="80" r="1" fill="#d946ef"/>
    <circle cx="480" cy="120" r="1.5" fill="#a78bfa"/>
    <circle cx="550" cy="150" r="1" fill="#67e8f9"/>
    <circle cx="470" cy="200" r="1.5" fill="#d946ef"/>
    <circle cx="530" cy="250" r="1" fill="#a78bfa"/>
    <circle cx="490" cy="300" r="1.5" fill="#67e8f9"/>
    <circle cx="560" cy="350" r="1" fill="#d946ef"/>
    <circle cx="600" cy="100" r="1" fill="#a78bfa"/>
    <circle cx="650" cy="200" r="1.5" fill="#67e8f9"/>
    <circle cx="680" cy="300" r="1" fill="#d946ef"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#07101f"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes ringRotate { 0% { transform: rotate(0deg); transform-origin: 430px 120px; } 100% { transform: rotate(360deg); transform-origin: 430px 120px; } }
    @keyframes dotPulse { 0%,100% { r: 5; } 50% { r: 6; } }
    @keyframes borderAnim { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .ring-rotate { animation: ringRotate 15s linear infinite; }
    .dot-pulse { animation: dotPulse 2s ease-in-out infinite; }
    .border-anim { animation: borderAnim 15s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="540" height="280" fill="url(#bg)" rx="12"/>
  <rect width="540" height="280" fill="url(#grid)" rx="12"/>

  <!-- Border -->
  <rect x="1" y="1" width="538" height="278" rx="12" fill="none" stroke="url(#border)" stroke-width="1" opacity="0.4" stroke-dasharray="6 3" class="border-anim"/>

  <!-- Header -->
  <text x="24" y="38" class="sans" font-size="18" font-weight="800" fill="#e2e8f0">📊 Ankit's GitHub Stats</text>
  <text x="24" y="56" class="mono" font-size="10" fill="#64748b">@Ankit-Basu • developer dashboard</text>

  <!-- Stat rows -->
  <g>
    <circle cx="36" cy="90" r="5" fill="#4ade80" class="dot-pulse"/>
    <text x="50" y="94" class="mono" fill="#94a3b8" font-size="12">Profile</text>
    <text x="160" y="94" class="mono" fill="#e2e8f0" font-size="12" font-weight="600">Full Stack • ML • DevOps</text>
  </g>
  <g>
    <circle cx="36" cy="120" r="5" fill="#67e8f9" class="dot-pulse" style="animation-delay: 0.3s"/>
    <text x="50" y="124" class="mono" fill="#94a3b8" font-size="12">Primary Focus</text>
    <text x="160" y="124" class="mono" fill="#e2e8f0" font-size="12" font-weight="600">Build • Learn • Solve</text>
  </g>
  <g>
    <circle cx="36" cy="150" r="5" fill="#a78bfa" class="dot-pulse" style="animation-delay: 0.6s"/>
    <text x="50" y="154" class="mono" fill="#94a3b8" font-size="12">Core</text>
    <text x="160" y="154" class="mono" fill="#e2e8f0" font-size="12" font-weight="600">Java • Web • AI</text>
  </g>
  <g>
    <circle cx="36" cy="180" r="5" fill="#d946ef" class="dot-pulse" style="animation-delay: 0.9s"/>
    <text x="50" y="184" class="mono" fill="#94a3b8" font-size="12">Status</text>
    <text x="160" y="184" class="mono" fill="#4ade80" font-size="12" font-weight="600">Open to collaborate</text>
  </g>

  <!-- Circular avatar ring -->
  <g>
    <!-- Outer rotating ring -->
    <circle cx="430" cy="120" r="58" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="20 10" opacity="0.4" class="ring-rotate"/>
    <!-- Static ring -->
    <circle cx="430" cy="120" r="48" fill="none" stroke="#1e293b" stroke-width="2"/>
    <!-- Inner circle -->
    <circle cx="430" cy="120" r="40" fill="#0f172a"/>
    <!-- Initial -->
    <text x="430" y="130" class="sans" fill="url(#ringGrad)" font-size="32" font-weight="900" text-anchor="middle" filter="url(#glow)">A</text>
    <!-- Label -->
    <text x="430" y="195" class="mono" fill="#64748b" font-size="10" text-anchor="middle" letter-spacing="2">ANKIT</text>
  </g>

  <!-- Footer -->
  <text x="24" y="254" class="mono" fill="#475569" font-size="9">Custom local card • no third-party stats dependency</text>
  <line x1="24" y1="230" x2="516" y2="230" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Decorative -->
  <circle cx="500" cy="250" r="2" fill="#67e8f9" opacity="0.3"/>
  <circle cx="510" cy="240" r="1.5" fill="#d946ef" opacity="0.3"/>
  <circle cx="490" cy="258" r="1" fill="#a78bfa" opacity="0.3"/>
</svg>

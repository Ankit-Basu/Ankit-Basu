<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07070b"/>
      <stop offset="100%" style="stop-color:#0e0e17"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161624;stop-opacity:0.75"/>
      <stop offset="100%" style="stop-color:#0f0f18;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>

    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes progress1 { 0% { width: 0; } 100% { width: 280px; } }
    @keyframes progress2 { 0% { width: 0; } 100% { width: 268px; } }
    @keyframes progress3 { 0% { width: 0; } 100% { width: 250px; } }
    @keyframes progress4 { 0% { width: 0; } 100% { width: 238px; } }
    @keyframes dotPulse { 0%, 100% { r: 4.5; opacity: 1; } 50% { r: 6; opacity: 0.4; } }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .p-bar1 { animation: progress1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar2 { animation: progress2 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar3 { animation: progress3 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar4 { animation: progress4 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .dot-1 { animation: dotPulse 2s ease-in-out infinite; }
    .dot-2 { animation: dotPulse 2s ease-in-out infinite 0.5s; }
    .dot-3 { animation: dotPulse 2s ease-in-out infinite 1.0s; }
    .dot-4 { animation: dotPulse 2s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="18"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>

  <!-- ================= LEFT PANEL: STATS TELEMETRY ================= -->
  <g transform="translate(48, 36)">
    <text class="sans" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="2">SYSTEM METRICS</text>
    <text y="28" class="sans" font-size="22" font-weight="900" fill="#ffffff">Engineering Telemetry</text>

    <!-- Metric Rows -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="0" r="4.5" fill="#06b6d4" class="dot-1" filter="url(#glow)"/>
      <text x="20" y="4" class="mono" fill="#94a3b8" font-size="12" font-weight="600">Profile</text>
      <text x="135" y="4" class="mono" fill="#f8fafc" font-size="12.5" font-weight="700">Full Stack • ML • DevOps</text>
    </g>

    <g transform="translate(0, 88)">
      <circle cx="6" cy="0" r="4.5" fill="#7c3aed" class="dot-2" filter="url(#glow)"/>
      <text x="20" y="4" class="mono" fill="#94a3b8" font-size="12" font-weight="600">Academics</text>
      <text x="135" y="4" class="mono" fill="#38bdf8" font-size="12.5" font-weight="700">B.Tech CSE (CGPA: 9.2 / 10)</text>
    </g>

    <g transform="translate(0, 124)">
      <circle cx="6" cy="0" r="4.5" fill="#38bdf8" class="dot-3" filter="url(#glow)"/>
      <text x="20" y="4" class="mono" fill="#94a3b8" font-size="12" font-weight="600">Competitive</text>
      <text x="135" y="4" class="mono" fill="#f8fafc" font-size="12.5" font-weight="700">400+ Solved • Top 25% Contest Rank</text>
    </g>

    <g transform="translate(0, 160)">
      <circle cx="6" cy="0" r="4.5" fill="#10b981" class="dot-4" filter="url(#glow)"/>
      <text x="20" y="4" class="mono" fill="#94a3b8" font-size="12" font-weight="600">Status</text>
      <text x="135" y="4" class="mono" fill="#10b981" font-size="12.5" font-weight="700">Open for SDE &amp; AI Engineering Roles</text>
    </g>

    <!-- Telemetry Graph Curve -->
    <path d="M 0 216 Q 100 200, 200 212 T 360 190 T 480 206" fill="none" stroke="url(#bar1)" stroke-width="2" opacity="0.8"/>
    <circle cx="480" cy="206" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <text x="0" y="246" class="mono" fill="#64748b" font-size="10">Real-time local telemetry telemetry matrix</text>
  </g>

  <!-- Divider -->
  <line x1="580" y1="36" x2="580" y2="284" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- ================= RIGHT PANEL: TECHNICAL MASTERY PROGRESS BARS ================= -->
  <g transform="translate(620, 36)">
    <text class="sans" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="2">PROFICIENCY MATRIX</text>
    <text y="28" class="sans" font-size="22" font-weight="900" fill="#ffffff">Technical Mastery</text>

    <!-- Progress Bar 1 -->
    <g transform="translate(0, 52)">
      <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">Java / DSA</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#141420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="282" height="14" rx="7" fill="url(#bar1)" class="p-bar1" filter="url(#glow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#06b6d4" font-weight="800">94%</text>
    </g>

    <!-- Progress Bar 2 -->
    <g transform="translate(0, 92)">
      <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">Full Stack (MERN)</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#141420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="270" height="14" rx="7" fill="url(#bar2)" class="p-bar2" filter="url(#glow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#38bdf8" font-weight="800">90%</text>
    </g>

    <!-- Progress Bar 3 -->
    <g transform="translate(0, 132)">
      <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">Cloud &amp; DevOps</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#141420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="252" height="14" rx="7" fill="url(#bar3)" class="p-bar3" filter="url(#glow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#06b6d4" font-weight="800">84%</text>
    </g>

    <!-- Progress Bar 4 -->
    <g transform="translate(0, 172)">
      <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">AI / Deep Learning</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#141420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="240" height="14" rx="7" fill="url(#bar4)" class="p-bar4" filter="url(#glow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#a855f7" font-weight="800">80%</text>
    </g>

    <text x="0" y="246" class="mono" fill="#64748b" font-size="10">Java • React • Node.js • Docker • Python • AWS • PyTorch</text>
  </g>
</svg>
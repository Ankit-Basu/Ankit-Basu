<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bgGrad_s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassCard_s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.7"/>
    </linearGradient>

    <linearGradient id="curveArea_s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbe2a7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fbe2a7;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="barCream_s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="100%" style="stop-color:#fae8bd"/>
    </linearGradient>

    <linearGradient id="barRose_s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e4a2b1"/>
      <stop offset="100%" style="stop-color:#efaebc"/>
    </linearGradient>

    <filter id="creamGlow_s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="roseGlow_s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="cardShadow_s" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle grain texture -->
    <filter id="grain_s" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="0.97"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <style>
    @keyframes progress1_s { 0% { width: 0; } 100% { width: 282px; } }
    @keyframes progress2_s { 0% { width: 0; } 100% { width: 270px; } }
    @keyframes progress3_s { 0% { width: 0; } 100% { width: 252px; } }
    @keyframes progress4_s { 0% { width: 0; } 100% { width: 240px; } }
    @keyframes pulseGlow_s { 0%, 100% { r: 4.5; opacity: 1; } 50% { r: 6.5; opacity: 0.4; } }
    @keyframes drawLine_s { 0% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: 0; } }

    .mono_s { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_s { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .p-bar1_s { animation: progress1_s 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar2_s { animation: progress2_s 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; }
    .p-bar3_s { animation: progress3_s 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.30s forwards; }
    .p-bar4_s { animation: progress4_s 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards; }
    .pulse-dot_s { animation: pulseGlow_s 2s ease-in-out infinite; }
    .draw-curve_s { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawLine_s 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad_s)" rx="16"/>

  <!-- Main container with grain texture -->
  <g filter="url(#grain_s)">
    <rect x="24" y="20" width="1152" height="300" rx="16" fill="url(#glassCard_s)" stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow_s)"/>
  </g>

  <!-- ====== LEFT PANEL: GITHUB ACTIVITY (not identity data) ====== -->
  <g transform="translate(56, 42)">
    <text class="sans_s" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">GITHUB ACTIVITY</text>
    <text y="28" class="sans_s" font-size="22" font-weight="900" fill="#fbe2a7">Development Momentum</text>

    <!-- Big stat cards row -->
    <g transform="translate(0, 52)">
      <!-- Repos -->
      <rect x="0" y="0" width="110" height="64" rx="10" fill="#0d1f2a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="55" y="30" class="sans_s" font-size="28" font-weight="900" fill="#fbe2a7" text-anchor="middle" filter="url(#creamGlow_s)">30+</text>
      <text x="55" y="50" class="mono_s" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">REPOSITORIES</text>

      <!-- Contributions -->
      <rect x="122" y="0" width="110" height="64" rx="10" fill="#0d1f2a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="177" y="30" class="sans_s" font-size="28" font-weight="900" fill="#e4a2b1" text-anchor="middle" filter="url(#roseGlow_s)">1.2K</text>
      <text x="177" y="50" class="mono_s" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">CONTRIBUTIONS</text>

      <!-- Languages -->
      <rect x="244" y="0" width="110" height="64" rx="10" fill="#0d1f2a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="299" y="30" class="sans_s" font-size="28" font-weight="900" fill="#fbe2a7" text-anchor="middle" filter="url(#creamGlow_s)">12</text>
      <text x="299" y="50" class="mono_s" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">LANGUAGES</text>

      <!-- Streak -->
      <rect x="366" y="0" width="110" height="64" rx="10" fill="#0d1f2a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="421" y="30" class="sans_s" font-size="28" font-weight="900" fill="#e4a2b1" text-anchor="middle" filter="url(#roseGlow_s)">45</text>
      <text x="421" y="50" class="mono_s" font-size="10" font-weight="700" fill="#8a97a0" text-anchor="middle">DAY STREAK</text>
    </g>

    <!-- Weekly activity sparkline -->
    <g transform="translate(0, 130)">
      <text class="mono_s" font-size="10" font-weight="600" fill="#8a97a0" letter-spacing="1">WEEKLY COMMIT ACTIVITY</text>
      <!-- Area fill under sparkline -->
      <path d="M 0 100 L 40 82 L 100 90 L 160 60 L 220 72 L 280 42 L 340 55 L 400 30 L 460 38 L 476 35 L 476 100 Z" fill="url(#curveArea_s)" transform="translate(0, 14)"/>
      <!-- Sparkline -->
      <path d="M 0 100 L 40 82 L 100 90 L 160 60 L 220 72 L 280 42 L 340 55 L 400 30 L 460 38 L 476 35" fill="none" stroke="#fbe2a7" stroke-width="2.5" class="draw-curve_s" filter="url(#creamGlow_s)" transform="translate(0, 14)"/>
      <!-- Endpoint dot -->
      <circle cx="476" cy="49" r="5" fill="#e4a2b1" filter="url(#roseGlow_s)"/>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="580" y1="42" x2="580" y2="295" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ====== RIGHT PANEL: PROFICIENCY BARS (kept, these are unique data) ====== -->
  <g transform="translate(620, 42)">
    <text class="sans_s" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">PROFICIENCY MATRIX</text>
    <text y="28" class="sans_s" font-size="22" font-weight="900" fill="#fbe2a7">Technical Mastery</text>

    <!-- Progress Bar 1: Java / DSA -->
    <g transform="translate(0, 52)">
      <text x="0" y="12" class="mono_s" font-size="12" fill="#f5f0e8" font-weight="700">Java / DSA</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="160" y="1" width="282" height="14" rx="7" fill="url(#barRose_s)" class="p-bar1_s" filter="url(#roseGlow_s)"/>
      <circle cx="442" cy="8" r="4" fill="#e4a2b1" class="pulse-dot_s" filter="url(#roseGlow_s)"/>
      <text x="475" y="13" class="mono_s" font-size="11" fill="#e4a2b1" font-weight="800">94%</text>
    </g>

    <!-- Progress Bar 2: Full Stack -->
    <g transform="translate(0, 92)">
      <text x="0" y="12" class="mono_s" font-size="12" fill="#f5f0e8" font-weight="700">Full Stack (MERN)</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="160" y="1" width="270" height="14" rx="7" fill="url(#barCream_s)" class="p-bar2_s" filter="url(#creamGlow_s)"/>
      <circle cx="430" cy="8" r="4" fill="#fbe2a7" class="pulse-dot_s" filter="url(#creamGlow_s)"/>
      <text x="475" y="13" class="mono_s" font-size="11" fill="#fbe2a7" font-weight="800">90%</text>
    </g>

    <!-- Progress Bar 3: Cloud & DevOps -->
    <g transform="translate(0, 132)">
      <text x="0" y="12" class="mono_s" font-size="12" fill="#f5f0e8" font-weight="700">Cloud &amp; DevOps</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="160" y="1" width="252" height="14" rx="7" fill="url(#barRose_s)" class="p-bar3_s" filter="url(#roseGlow_s)"/>
      <circle cx="412" cy="8" r="4" fill="#e4a2b1" class="pulse-dot_s" filter="url(#roseGlow_s)"/>
      <text x="475" y="13" class="mono_s" font-size="11" fill="#e4a2b1" font-weight="800">84%</text>
    </g>

    <!-- Progress Bar 4: AI / Deep Learning -->
    <g transform="translate(0, 172)">
      <text x="0" y="12" class="mono_s" font-size="12" fill="#f5f0e8" font-weight="700">AI / Deep Learning</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="160" y="1" width="240" height="14" rx="7" fill="url(#barCream_s)" class="p-bar4_s" filter="url(#creamGlow_s)"/>
      <circle cx="400" cy="8" r="4" fill="#fbe2a7" class="pulse-dot_s" filter="url(#creamGlow_s)"/>
      <text x="475" y="13" class="mono_s" font-size="11" fill="#fbe2a7" font-weight="800">80%</text>
    </g>

    <text x="0" y="232" class="mono_s" fill="#8a97a0" font-size="10.5">Java &#x2022; React &#x2022; Node.js &#x2022; Docker &#x2022; Python &#x2022; AWS &#x2022; PyTorch</text>
  </g>
</svg>
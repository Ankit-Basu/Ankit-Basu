name: Game Mode vote

# A visitor opens an issue titled "vote: <quest>" from the README links.
# This counts it into data/votes.json, redraws votes.svg, replies and closes.
#
# The issue title is attacker-controlled text: it is only ever passed through
# env vars, never interpolated into a run: script, and scripts/vote.py accepts
# nothing but an exact known quest key.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# shares the stats job's group so two pushes never race on main
concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  vote:
    if: startsWith(github.event.issue.title, 'vote:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Count the vote
        id: count
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python scripts/vote.py

      - name: Redraw and commit
        if: steps.count.outputs.changed == 'true'
        run: |
          python scripts/build.py
          python scripts/verify.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.svg' data/votes.json
          git commit -m "chore: count a Game Mode vote [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && break
            sleep 5
          done

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLY: ${{ steps.count.outputs.reply }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$REPLY"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"

    <linearGradient id="bg_g" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>

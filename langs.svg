<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d171d"/>
      <stop offset="100%" style="stop-color:#14222b"/>
    </linearGradient>

    <linearGradient id="creamBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="100%" style="stop-color:#fdecc4"/>
    </linearGradient>

    <linearGradient id="roseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e4a7b1"/>
      <stop offset="100%" style="stop-color:#f2bac3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes progress1 { 0% { width: 0; } 100% { width: 220px; } }
    @keyframes progress2 { 0% { width: 0; } 100% { width: 205px; } }
    @keyframes progress3 { 0% { width: 0; } 100% { width: 190px; } }
    @keyframes progress4 { 0% { width: 0; } 100% { width: 175px; } }
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .p-bar1 { animation: progress1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar2 { animation: progress2 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar3 { animation: progress3 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar4 { animation: progress4 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <!-- Background -->
  <rect width="460" height="300" fill="url(#bg)" rx="16"/>
  <rect x="1" y="1" width="458" height="298" rx="16" fill="none" stroke="#243744" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(28, 38)">
    <text class="sans" font-size="19" font-weight="900" fill="#e4a7b1">🧠 Technical Mastery</text>
    <text y="20" class="mono" font-size="11" font-weight="500" fill="#859ba8">Current developer stack</text>
  </g>

  <!-- Progress Bar 1: Java / DSA -->
  <g transform="translate(28, 88)">
    <text x="0" y="12" class="mono" font-size="12" fill="#d6e2e9" font-weight="700">Java / DSA</text>
    <rect x="145" y="1" width="235" height="14" rx="7" fill="#172630" stroke="#243744" stroke-width="1"/>
    <rect x="145" y="1" width="220" height="14" rx="7" fill="url(#creamBar)" class="p-bar1" filter="url(#glow)"/>
    <text x="390" y="13" class="mono" font-size="11" fill="#fbe2a7" font-weight="800">94%</text>
  </g>

  <!-- Progress Bar 2: Full Stack -->
  <g transform="translate(28, 126)">
    <text x="0" y="12" class="mono" font-size="12" fill="#d6e2e9" font-weight="700">Full Stack (MERN)</text>
    <rect x="145" y="1" width="235" height="14" rx="7" fill="#172630" stroke="#243744" stroke-width="1"/>
    <rect x="145" y="1" width="205" height="14" rx="7" fill="url(#roseBar)" class="p-bar2" filter="url(#glow)"/>
    <text x="390" y="13" class="mono" font-size="11" fill="#e4a7b1" font-weight="800">90%</text>
  </g>

  <!-- Progress Bar 3: DevOps & Cloud -->
  <g transform="translate(28, 164)">
    <text x="0" y="12" class="mono" font-size="12" fill="#d6e2e9" font-weight="700">DevOps &amp; Cloud</text>
    <rect x="145" y="1" width="235" height="14" rx="7" fill="#172630" stroke="#243744" stroke-width="1"/>
    <rect x="145" y="1" width="190" height="14" rx="7" fill="url(#creamBar)" class="p-bar3" filter="url(#glow)"/>
    <text x="390" y="13" class="mono" font-size="11" fill="#fbe2a7" font-weight="800">84%</text>
  </g>

  <!-- Progress Bar 4: ML / GenAI -->
  <g transform="translate(28, 202)">
    <text x="0" y="12" class="mono" font-size="12" fill="#d6e2e9" font-weight="700">ML &amp; GenAI</text>
    <rect x="145" y="1" width="235" height="14" rx="7" fill="#172630" stroke="#243744" stroke-width="1"/>
    <rect x="145" y="1" width="175" height="14" rx="7" fill="url(#roseBar)" class="p-bar4" filter="url(#glow)"/>
    <text x="390" y="13" class="mono" font-size="11" fill="#e4a7b1" font-weight="800">80%</text>
  </g>

  <!-- Divider & Footer -->
  <line x1="28" y1="246" x2="432" y2="246" stroke="#1f323e" stroke-width="1"/>
  <text x="28" y="274" class="mono" fill="#859ba8" font-size="10">Java • React • Node.js • Docker • Python • AWS • PyTorch</text>
</svg>
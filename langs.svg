<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#07101f"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes progress1 { 0% { width: 0; } 100% { width: 175px; } }
    @keyframes progress2 { 0% { width: 0; } 100% { width: 160px; } }
    @keyframes progress3 { 0% { width: 0; } 100% { width: 145px; } }
    @keyframes progress4 { 0% { width: 0; } 100% { width: 135px; } }
    @keyframes borderAnim { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -600; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .p-bar1 { animation: progress1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar2 { animation: progress2 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar3 { animation: progress3 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar4 { animation: progress4 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .border-anim { animation: borderAnim 15s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="420" height="280" fill="url(#bg)" rx="12"/>
  <rect width="420" height="280" fill="url(#grid)" rx="12"/>

  <!-- Border -->
  <rect x="1" y="1" width="418" height="278" rx="12" fill="none" stroke="url(#border)" stroke-width="1" opacity="0.4" stroke-dasharray="6 3" class="border-anim"/>

  <!-- Header -->
  <text x="24" y="38" class="sans" font-size="18" font-weight="800" fill="#e2e8f0">🧠 Tech Focus</text>
  <text x="24" y="56" class="mono" font-size="10" fill="#64748b">Current developer stack</text>

  <!-- Progress Bar 1: Java / DSA -->
  <g transform="translate(24, 78)">
    <text x="0" y="12" class="mono" font-size="11" fill="#cbd5e1" font-weight="600">Java / DSA</text>
    <rect x="140" y="2" width="230" height="12" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="140" y="2" width="205" height="12" rx="6" fill="url(#bar1)" class="p-bar1" filter="url(#glow)"/>
    <text x="380" y="12" class="mono" font-size="10" fill="#67e8f9" font-weight="600">90%</text>
  </g>

  <!-- Progress Bar 2: Full Stack -->
  <g transform="translate(24, 114)">
    <text x="0" y="12" class="mono" font-size="11" fill="#cbd5e1" font-weight="600">Full Stack</text>
    <rect x="140" y="2" width="230" height="12" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="140" y="2" width="190" height="12" rx="6" fill="url(#bar2)" class="p-bar2" filter="url(#glow)"/>
    <text x="380" y="12" class="mono" font-size="10" fill="#818cf8" font-weight="600">85%</text>
  </g>

  <!-- Progress Bar 3: DevOps & Cloud -->
  <g transform="translate(24, 150)">
    <text x="0" y="12" class="mono" font-size="11" fill="#cbd5e1" font-weight="600">DevOps / Cloud</text>
    <rect x="140" y="2" width="230" height="12" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="140" y="2" width="175" height="12" rx="6" fill="url(#bar3)" class="p-bar3" filter="url(#glow)"/>
    <text x="380" y="12" class="mono" font-size="10" fill="#c084fc" font-weight="600">78%</text>
  </g>

  <!-- Progress Bar 4: ML / GenAI -->
  <g transform="translate(24, 186)">
    <text x="0" y="12" class="mono" font-size="11" fill="#cbd5e1" font-weight="600">ML / GenAI</text>
    <rect x="140" y="2" width="230" height="12" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="140" y="2" width="165" height="12" rx="6" fill="url(#bar4)" class="p-bar4" filter="url(#glow)"/>
    <text x="380" y="12" class="mono" font-size="10" fill="#f472b6" font-weight="600">72%</text>
  </g>

  <!-- Divider & Footer -->
  <line x1="24" y1="230" x2="396" y2="230" stroke="#1e293b" stroke-width="0.5"/>
  <text x="24" y="254" class="mono" fill="#64748b" font-size="9.5">Java • React • Node.js • Docker • Python • AWS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="100%" style="stop-color:#071022"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>

    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>

    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>

    <linearGradient id="bar4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1e293b" stroke-width="0.4" opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    @keyframes progress1 { 0% { width: 0; } 100% { width: 200px; } }
    @keyframes progress2 { 0% { width: 0; } 100% { width: 185px; } }
    @keyframes progress3 { 0% { width: 0; } 100% { width: 170px; } }
    @keyframes progress4 { 0% { width: 0; } 100% { width: 160px; } }
    @keyframes borderSpin { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -700; } }
    
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .p-bar1 { animation: progress1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar2 { animation: progress2 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar3 { animation: progress3 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar4 { animation: progress4 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .border-anim { animation: borderSpin 18s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="440" height="300" fill="url(#bg)" rx="14"/>
  <rect width="440" height="300" fill="url(#grid)" rx="14"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="437" height="297" rx="14" fill="none" stroke="url(#border)" stroke-width="1.4" opacity="0.75" stroke-dasharray="8 4" class="border-anim"/>

  <!-- Header -->
  <g transform="translate(28, 40)">
    <text class="sans" font-size="20" font-weight="900" fill="#f8fafc">🧠 Tech Focus</text>
    <text y="22" class="mono" font-size="11" font-weight="500" fill="#64748b">Current developer stack</text>
  </g>

  <!-- Progress Bar 1: Java / DSA -->
  <g transform="translate(28, 88)">
    <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">Java / DSA</text>
    <rect x="135" y="1" width="220" height="14" rx="7" fill="#091428" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="135" y="1" width="202" height="14" rx="7" fill="url(#bar1)" class="p-bar1" filter="url(#glow)"/>
    <text x="365" y="13" class="mono" font-size="11" fill="#00f2fe" font-weight="800">92%</text>
  </g>

  <!-- Progress Bar 2: Full Stack -->
  <g transform="translate(28, 126)">
    <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">Full Stack</text>
    <rect x="135" y="1" width="220" height="14" rx="7" fill="#091428" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="135" y="1" width="188" height="14" rx="7" fill="url(#bar2)" class="p-bar2" filter="url(#glow)"/>
    <text x="365" y="13" class="mono" font-size="11" fill="#818cf8" font-weight="800">88%</text>
  </g>

  <!-- Progress Bar 3: DevOps & Cloud -->
  <g transform="translate(28, 164)">
    <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">DevOps / Cloud</text>
    <rect x="135" y="1" width="220" height="14" rx="7" fill="#091428" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="135" y="1" width="176" height="14" rx="7" fill="url(#bar3)" class="p-bar3" filter="url(#glow)"/>
    <text x="365" y="13" class="mono" font-size="11" fill="#c084fc" font-weight="800">80%</text>
  </g>

  <!-- Progress Bar 4: ML / GenAI -->
  <g transform="translate(28, 202)">
    <text x="0" y="12" class="mono" font-size="12" fill="#cbd5e1" font-weight="700">ML / GenAI</text>
    <rect x="135" y="1" width="220" height="14" rx="7" fill="#091428" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="135" y="1" width="165" height="14" rx="7" fill="url(#bar4)" class="p-bar4" filter="url(#glow)"/>
    <text x="365" y="13" class="mono" font-size="11" fill="#f472b6" font-weight="800">75%</text>
  </g>

  <!-- Divider & Footer -->
  <line x1="28" y1="248" x2="412" y2="248" stroke="#1e293b" stroke-width="1"/>
  <text x="28" y="274" class="mono" fill="#64748b" font-size="10">Java • React • Node.js • Docker • Python • AWS</text>
</svg>
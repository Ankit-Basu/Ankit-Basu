<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.75"/>
    </linearGradient>

    <!-- Curve Area Fill Gradient (Cream to Transparent) -->
    <linearGradient id="curveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbe2a7;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#fbe2a7;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="barCream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="100%" style="stop-color:#fae8bd"/>
    </linearGradient>

    <linearGradient id="barRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e4a2b1"/>
      <stop offset="100%" style="stop-color:#efaebc"/>
    </linearGradient>

    <filter id="creamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes progress1 { 0% { width: 0; } 100% { width: 282px; } }
    @keyframes progress2 { 0% { width: 0; } 100% { width: 270px; } }
    @keyframes progress3 { 0% { width: 0; } 100% { width: 252px; } }
    @keyframes progress4 { 0% { width: 0; } 100% { width: 240px; } }
    @keyframes pulseGlow { 0%, 100% { r: 4.5; opacity: 1; } 50% { r: 6.5; opacity: 0.4; } }
    @keyframes drawLine { 0% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: 0; } }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .p-bar1 { animation: progress1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .p-bar2 { animation: progress2 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; }
    .p-bar3 { animation: progress3 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.30s forwards; }
    .p-bar4 { animation: progress4 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards; }
    .pulse-dot { animation: pulseGlow 2s ease-in-out infinite; }
    .draw-curve { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawLine 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Main Unified Glass Container -->
  <rect x="24" y="20" width="1152" height="300" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>

  <!-- ================= LEFT PANEL: SYSTEM METRICS ================= -->
  <g transform="translate(56, 42)">
    <text class="sans" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">SYSTEM METRICS</text>
    <text y="28" class="sans" font-size="22" font-weight="900" fill="#fbe2a7">Engineering Telemetry</text>

    <!-- Metric Rows -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="0" r="4.5" fill="#e4a2b1" class="pulse-dot" filter="url(#roseGlow)"/>
      <text x="20" y="4" class="mono" fill="#8a97a0" font-size="12" font-weight="600">Profile</text>
      <text x="135" y="4" class="mono" fill="#f5f0e8" font-size="12.5" font-weight="700">Full Stack • ML • DevOps</text>
    </g>

    <g transform="translate(0, 84)">
      <circle cx="6" cy="0" r="4.5" fill="#fbe2a7" class="pulse-dot" filter="url(#creamGlow)"/>
      <text x="20" y="4" class="mono" fill="#8a97a0" font-size="12" font-weight="600">Academics</text>
      <text x="135" y="4" class="mono" fill="#fbe2a7" font-size="12.5" font-weight="700">B.Tech CSE (CGPA: 9.2 / 10)</text>
    </g>

    <g transform="translate(0, 116)">
      <circle cx="6" cy="0" r="4.5" fill="#e4a2b1" class="pulse-dot" filter="url(#roseGlow)"/>
      <text x="20" y="4" class="mono" fill="#8a97a0" font-size="12" font-weight="600">Competitive</text>
      <text x="135" y="4" class="mono" fill="#f5f0e8" font-size="12.5" font-weight="700">400+ Solved • Top 25% Contest Rank</text>
    </g>

    <g transform="translate(0, 148)">
      <circle cx="6" cy="0" r="4.5" fill="#fbe2a7" class="pulse-dot" filter="url(#creamGlow)"/>
      <text x="20" y="4" class="mono" fill="#8a97a0" font-size="12" font-weight="600">Status</text>
      <text x="135" y="4" class="mono" fill="#e4a2b1" font-size="12.5" font-weight="700">Open for SDE &amp; AI Engineering Roles</text>
    </g>

    <!-- Visual Sparkline with Gradient Area Fill (No Dead Space) -->
    <path d="M 0 230 Q 100 200, 200 215 T 360 185 T 480 200 L 480 240 L 0 240 Z" fill="url(#curveArea)"/>
    <path d="M 0 230 Q 100 200, 200 215 T 360 185 T 480 200" fill="none" stroke="#fbe2a7" stroke-width="2.5" class="draw-curve" filter="url(#creamGlow)"/>
    <circle cx="480" cy="200" r="5" fill="#e4a2b1" filter="url(#roseGlow)"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="580" y1="42" x2="580" y2="295" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- ================= RIGHT PANEL: TECHNICAL MASTERY ================= -->
  <g transform="translate(620, 42)">
    <text class="sans" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">PROFICIENCY MATRIX</text>
    <text y="28" class="sans" font-size="22" font-weight="900" fill="#fbe2a7">Technical Mastery</text>

    <!-- Progress Bar 1: Java / DSA -->
    <g transform="translate(0, 52)">
      <text x="0" y="12" class="mono" font-size="12" fill="#f5f0e8" font-weight="700">Java / DSA</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="282" height="14" rx="7" fill="url(#barRose)" class="p-bar1" filter="url(#roseGlow)"/>
      <circle cx="442" cy="8" r="4" fill="#e4a2b1" class="pulse-dot" filter="url(#roseGlow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#e4a2b1" font-weight="800">94%</text>
    </g>

    <!-- Progress Bar 2: Full Stack -->
    <g transform="translate(0, 92)">
      <text x="0" y="12" class="mono" font-size="12" fill="#f5f0e8" font-weight="700">Full Stack (MERN)</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="270" height="14" rx="7" fill="url(#barCream)" class="p-bar2" filter="url(#creamGlow)"/>
      <circle cx="430" cy="8" r="4" fill="#fbe2a7" class="pulse-dot" filter="url(#creamGlow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#fbe2a7" font-weight="800">90%</text>
    </g>

    <!-- Progress Bar 3: Cloud & DevOps -->
    <g transform="translate(0, 132)">
      <text x="0" y="12" class="mono" font-size="12" fill="#f5f0e8" font-weight="700">Cloud &amp; DevOps</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="252" height="14" rx="7" fill="url(#barRose)" class="p-bar3" filter="url(#roseGlow)"/>
      <circle cx="412" cy="8" r="4" fill="#e4a2b1" class="pulse-dot" filter="url(#roseGlow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#e4a2b1" font-weight="800">84%</text>
    </g>

    <!-- Progress Bar 4: AI & Deep Learning -->
    <g transform="translate(0, 172)">
      <text x="0" y="12" class="mono" font-size="12" fill="#f5f0e8" font-weight="700">AI / Deep Learning</text>
      <rect x="160" y="1" width="300" height="14" rx="7" fill="#142631" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <rect x="160" y="1" width="240" height="14" rx="7" fill="url(#barCream)" class="p-bar4" filter="url(#creamGlow)"/>
      <circle cx="400" cy="8" r="4" fill="#fbe2a7" class="pulse-dot" filter="url(#creamGlow)"/>
      <text x="475" y="13" class="mono" font-size="11" fill="#fbe2a7" font-weight="800">80%</text>
    </g>

    <text x="0" y="242" class="mono" fill="#8a97a0" font-size="10.5">Java • React • Node.js • Docker • Python • AWS • PyTorch</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#07101f"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes borderAnim { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -800; } }
    @keyframes pulseGlow { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .border-anim { animation: borderAnim 20s linear infinite; }
    .glow-pulse { animation: pulseGlow 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="960" height="300" fill="url(#bg)" rx="12"/>
  <rect width="960" height="300" fill="url(#grid)" rx="12"/>

  <!-- Border -->
  <rect x="1" y="1" width="958" height="298" rx="12" fill="none" stroke="url(#border)" stroke-width="1" opacity="0.4" stroke-dasharray="6 3" class="border-anim"/>

  <!-- Header -->
  <text x="36" y="42" class="sans" font-size="20" font-weight="800" fill="#f1f5f9">🏆 Developer Achievements</text>
  <text x="36" y="62" class="mono" font-size="11" fill="#64748b">Competitive programming, hackathons &amp; academic milestones</text>

  <!-- Card 1: Hackathons -->
  <g transform="translate(36, 80)">
    <rect width="270" height="90" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="36" cy="45" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" opacity="0.8"/>
    <text x="36" y="52" font-size="20" text-anchor="middle">🥇</text>
    <text x="72" y="36" class="sans" font-size="13" font-weight="800" fill="url(#gold)">5+ Hackathon Wins</text>
    <text x="72" y="54" class="mono" font-size="10" fill="#94a3b8">Top ranks in National &amp;</text>
    <text x="72" y="68" class="mono" font-size="10" fill="#94a3b8">Inter-University Hackathons</text>
  </g>

  <!-- Card 2: LeetCode & DSA -->
  <g transform="translate(345, 80)">
    <rect width="270" height="90" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="36" cy="45" r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
    <text x="36" y="52" font-size="20" text-anchor="middle">💻</text>
    <text x="72" y="36" class="sans" font-size="13" font-weight="800" fill="url(#cyanGrad)">400+ Problems Solved</text>
    <text x="72" y="54" class="mono" font-size="10" fill="#94a3b8">LeetCode &amp; GFG | Max 1590</text>
    <text x="72" y="68" class="mono" font-size="10" fill="#67e8f9">Contest Rating: Top 25%</text>
  </g>

  <!-- Card 3: Codeforces & CodeChef -->
  <g transform="translate(654, 80)">
    <rect width="270" height="90" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="36" cy="45" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <text x="36" y="52" font-size="20" text-anchor="middle">⚡</text>
    <text x="72" y="36" class="sans" font-size="13" font-weight="800" fill="url(#purpleGrad)">Contest Ratings</text>
    <text x="72" y="54" class="mono" font-size="10" fill="#94a3b8">CF Rating: 1119 (Div3 #1178)</text>
    <text x="72" y="68" class="mono" font-size="10" fill="#94a3b8">CC Rating: 1489 (Global #1161)</text>
  </g>

  <!-- Bottom Row: Academic & Certifications Summary -->
  <g transform="translate(36, 185)">
    <rect width="888" height="85" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>

    <!-- Left side: Academic -->
    <text x="24" y="30" class="sans" font-size="13" font-weight="800" fill="#f1f5f9">🎓 Academic Excellence</text>
    <text x="24" y="50" class="mono" font-size="11" fill="#cbd5e1">B.Tech Computer Science &amp; Engineering • <tspan fill="#4ade80" font-weight="700">CGPA: 9.2 / 10</tspan></text>
    <text x="24" y="68" class="mono" font-size="10" fill="#64748b">Lovely Professional University | ISC: 95.25% • ICSE: 97.2%</text>

    <!-- Divider -->
    <line x1="520" y1="15" x2="520" y2="70" stroke="#1e293b" stroke-width="1"/>

    <!-- Right side: Certifications -->
    <text x="545" y="30" class="sans" font-size="13" font-weight="800" fill="#f1f5f9">📜 Key Certifications</text>
    <text x="545" y="50" class="mono" font-size="10.5" fill="#94a3b8">• NPTEL IIT Hyderabad: Privacy &amp; Security</text>
    <text x="545" y="68" class="mono" font-size="10.5" fill="#94a3b8">• Mastering C &amp; DSA • Java Application Dev</text>
  </g>
</svg>

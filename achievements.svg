<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d171d"/>
      <stop offset="100%" style="stop-color:#14222b"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172732;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#101c24;stop-opacity:0.95"/>
    </linearGradient>

    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="100%" style="stop-color:#e4a7b1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="960" height="320" fill="url(#bg)" rx="16"/>
  <rect x="1" y="1" width="958" height="318" rx="16" fill="none" stroke="#243744" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(36, 40)">
    <text class="sans" font-size="20" font-weight="900" fill="#fbe2a7">🏆 Verified Honors &amp; Milestones</text>
    <text y="22" class="mono" font-size="11" font-weight="500" fill="#859ba8">Competitive programming, hackathons &amp; academic excellence</text>
  </g>

  <!-- Card 1: Hackathons -->
  <g transform="translate(36, 80)">
    <rect width="272" height="92" rx="10" fill="url(#cardBg)" stroke="#243744" stroke-width="1"/>
    <circle cx="38" cy="46" r="22" fill="#132029" stroke="#fbe2a7" stroke-width="1.5" filter="url(#glow)"/>
    <text x="38" y="53" font-size="20" text-anchor="middle">🥇</text>
    <text x="74" y="37" class="sans" font-size="13.5" font-weight="900" fill="#fbe2a7">5+ Hackathon Podiums</text>
    <text x="74" y="56" class="mono" font-size="10.5" fill="#859ba8">National &amp; University</text>
    <text x="74" y="70" class="mono" font-size="10.5" fill="#859ba8">Inter-Varsity Ranks</text>
  </g>

  <!-- Card 2: LeetCode & DSA -->
  <g transform="translate(344, 80)">
    <rect width="272" height="92" rx="10" fill="url(#cardBg)" stroke="#243744" stroke-width="1"/>
    <circle cx="38" cy="46" r="22" fill="#132029" stroke="#e4a7b1" stroke-width="1.5" filter="url(#glow)"/>
    <text x="38" y="53" font-size="20" text-anchor="middle">💻</text>
    <text x="74" y="37" class="sans" font-size="13.5" font-weight="900" fill="#e4a7b1">400+ Problems Solved</text>
    <text x="74" y="56" class="mono" font-size="10.5" fill="#859ba8">LeetCode &amp; GFG • Max 1590</text>
    <text x="74" y="70" class="mono" font-size="10.5" fill="#fbe2a7" font-weight="700">Contest Rating: Top 25%</text>
  </g>

  <!-- Card 3: Codeforces & CodeChef -->
  <g transform="translate(652, 80)">
    <rect width="272" height="92" rx="10" fill="url(#cardBg)" stroke="#243744" stroke-width="1"/>
    <circle cx="38" cy="46" r="22" fill="#132029" stroke="#fbe2a7" stroke-width="1.5" filter="url(#glow)"/>
    <text x="38" y="53" font-size="20" text-anchor="middle">⚡</text>
    <text x="74" y="37" class="sans" font-size="13.5" font-weight="900" fill="#fbe2a7">Contest Rankings</text>
    <text x="74" y="56" class="mono" font-size="10.5" fill="#859ba8">CF: Div3 Rank 1178 (1119)</text>
    <text x="74" y="70" class="mono" font-size="10.5" fill="#859ba8">CC: Global Rank 1161 (1489)</text>
  </g>

  <!-- Bottom Academic & Certifications Card -->
  <g transform="translate(36, 190)">
    <rect width="888" height="96" rx="10" fill="url(#cardBg)" stroke="#243744" stroke-width="1"/>

    <!-- Left: Academic -->
    <text x="24" y="32" class="sans" font-size="14" font-weight="900" fill="#ffffff">🎓 Academic Honors</text>
    <text x="24" y="54" class="mono" font-size="12" fill="#d6e2e9">B.Tech Computer Science &amp; Engineering • <tspan fill="#fbe2a7" font-weight="800">CGPA: 9.2 / 10</tspan></text>
    <text x="24" y="72" class="mono" font-size="11" fill="#859ba8">Lovely Professional University | ISC: 95.25% • ICSE: 97.2%</text>

    <!-- Divider -->
    <line x1="530" y1="16" x2="530" y2="80" stroke="#243744" stroke-width="1"/>

    <!-- Right: Certifications -->
    <text x="555" y="32" class="sans" font-size="14" font-weight="900" fill="#ffffff">📜 Professional Certifications</text>
    <text x="555" y="54" class="mono" font-size="11.5" fill="#859ba8">• NPTEL IIT Hyderabad: Privacy &amp; Security in Social Media</text>
    <text x="555" y="72" class="mono" font-size="11.5" fill="#859ba8">• Advanced C &amp; DSA (CSE Pathshala) • Java App Dev (LPU)</text>
  </g>
</svg>
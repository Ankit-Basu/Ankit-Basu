<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="100%" style="stop-color:#071022"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1329"/>
      <stop offset="100%" style="stop-color:#0f1c3a"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.35" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes borderSpin { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -900; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .border-anim { animation: borderSpin 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="960" height="310" fill="url(#bg)" rx="14"/>
  <rect width="960" height="310" fill="url(#grid)" rx="14"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="957" height="307" rx="14" fill="none" stroke="url(#border)" stroke-width="1.4" opacity="0.75" stroke-dasharray="8 4" class="border-anim"/>

  <!-- Header -->
  <g transform="translate(36, 42)">
    <text class="sans" font-size="20" font-weight="900" fill="#f8fafc">🏆 Developer Achievements</text>
    <text y="22" class="mono" font-size="11.5" font-weight="500" fill="#64748b">Competitive programming, hackathons &amp; academic milestones</text>
  </g>

  <!-- Card 1: Hackathons -->
  <g transform="translate(36, 82)">
    <rect width="272" height="92" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="38" cy="46" r="23" fill="#091428" stroke="#fbbf24" stroke-width="1.8" filter="url(#glow)"/>
    <text x="38" y="54" font-size="21" text-anchor="middle">🥇</text>
    <text x="74" y="37" class="sans" font-size="14" font-weight="900" fill="url(#goldGrad)">5+ Hackathon Wins</text>
    <text x="74" y="56" class="mono" font-size="10.5" fill="#94a3b8">Top ranks in National &amp;</text>
    <text x="74" y="70" class="mono" font-size="10.5" fill="#94a3b8">Inter-University Hackathons</text>
  </g>

  <!-- Card 2: LeetCode & DSA -->
  <g transform="translate(344, 82)">
    <rect width="272" height="92" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="38" cy="46" r="23" fill="#091428" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow)"/>
    <text x="38" y="54" font-size="21" text-anchor="middle">💻</text>
    <text x="74" y="37" class="sans" font-size="14" font-weight="900" fill="url(#cyanGrad)">400+ Problems Solved</text>
    <text x="74" y="56" class="mono" font-size="10.5" fill="#94a3b8">LeetCode &amp; GFG | Max 1590</text>
    <text x="74" y="70" class="mono" font-size="10.5" fill="#00f2fe" font-weight="700">Contest Rating: Top 25%</text>
  </g>

  <!-- Card 3: Codeforces & CodeChef -->
  <g transform="translate(652, 82)">
    <rect width="272" height="92" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="38" cy="46" r="23" fill="#091428" stroke="#a855f7" stroke-width="1.8" filter="url(#glow)"/>
    <text x="38" y="54" font-size="21" text-anchor="middle">⚡</text>
    <text x="74" y="37" class="sans" font-size="14" font-weight="900" fill="url(#purpleGrad)">Contest Ratings</text>
    <text x="74" y="56" class="mono" font-size="10.5" fill="#94a3b8">CF Rating: 1119 (Div3 #1178)</text>
    <text x="74" y="70" class="mono" font-size="10.5" fill="#94a3b8">CC Rating: 1489 (Global #1161)</text>
  </g>

  <!-- Bottom Academic & Certifications Card -->
  <g transform="translate(36, 190)">
    <rect width="888" height="92" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.2"/>

    <!-- Left: Academic -->
    <text x="24" y="32" class="sans" font-size="14" font-weight="900" fill="#f8fafc">🎓 Academic Excellence</text>
    <text x="24" y="54" class="mono" font-size="12" fill="#cbd5e1">B.Tech Computer Science &amp; Engineering • <tspan fill="#4ade80" font-weight="800">CGPA: 9.2 / 10</tspan></text>
    <text x="24" y="72" class="mono" font-size="11" fill="#64748b">Lovely Professional University | ISC: 95.25% • ICSE: 97.2%</text>

    <!-- Divider -->
    <line x1="530" y1="16" x2="530" y2="76" stroke="#1e3a5f" stroke-width="1.2"/>

    <!-- Right: Certifications -->
    <text x="555" y="32" class="sans" font-size="14" font-weight="900" fill="#f8fafc">📜 Key Certifications</text>
    <text x="555" y="54" class="mono" font-size="11.5" fill="#94a3b8">• NPTEL IIT Hyderabad: Privacy &amp; Security</text>
    <text x="555" y="72" class="mono" font-size="11.5" fill="#94a3b8">• Mastering C &amp; DSA • Java Application Dev</text>
  </g>
</svg>
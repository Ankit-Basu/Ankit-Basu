<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="bgGrad_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <filter id="creamGlow_t" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink_t {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes typeLine1 {
      0% { width: 0; }
      60% { width: 410px; }
      100% { width: 410px; }
    }
    @keyframes typeLine2 {
      0%, 50% { width: 0; }
      100% { width: 340px; }
    }
    @keyframes typeLine3 {
      0%, 70% { width: 0; }
      100% { width: 280px; }
    }
    @keyframes fadeIn1 {
      0%, 55% { opacity: 0; }
      70% { opacity: 1; }
    }
    @keyframes fadeIn2 {
      0%, 72% { opacity: 0; }
      85% { opacity: 1; }
    }

    .mono_t { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans_t { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .cursor_t { animation: cursorBlink_t 0.9s infinite; }
    .type1 { animation: typeLine1 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .type2 { animation: typeLine2 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; animation-delay: 0.8s; }
    .type3 { animation: typeLine3 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; animation-delay: 1.6s; }
    .fadein1 { animation: fadeIn1 3s forwards; }
    .fadein2 { animation: fadeIn2 3s forwards; }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bgGrad_t)" rx="16"/>

  <!-- Terminal Window Frame (structural variety: window chrome, not a rounded rect panel) -->
  <g transform="translate(48, 20)">
    <!-- Terminal body with flat-top corners (window-like, not pill-shaped) -->
    <rect width="1104" height="200" rx="12" fill="#0a1a22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Title bar (darker strip with window buttons) -->
    <rect width="1104" height="36" rx="12" fill="#0d1f2a"/>
    <rect y="12" width="1104" height="24" fill="#0d1f2a"/>

    <!-- Traffic light dots -->
    <circle cx="22" cy="18" r="6" fill="#e4a2b1" opacity="0.9"/>
    <circle cx="42" cy="18" r="6" fill="#fbe2a7" opacity="0.9"/>
    <circle cx="62" cy="18" r="6" fill="#2b4759" opacity="0.6"/>

    <!-- Title text -->
    <text x="552" y="22" class="mono_t" font-size="12" font-weight="700" fill="#8a97a0" text-anchor="middle">ankit@dev ~ /projects</text>

    <!-- Terminal content -->
    <g transform="translate(24, 56)">
      <!-- Line 1: prompt + currently building -->
      <text x="0" y="0" class="mono_t" font-size="13" font-weight="700">
        <tspan fill="#e4a2b1">ankit@dev</tspan><tspan fill="#8a97a0">:</tspan><tspan fill="#fbe2a7">~/projects</tspan><tspan fill="#f5f0e8">$ </tspan><tspan fill="#f5f0e8">currently_building</tspan>
      </text>

      <!-- Line 2: output -->
      <text x="0" y="30" class="mono_t" font-size="13" font-weight="600" fill="#fbe2a7" class="fadein1">
        → SUDARSHAN-X v2.0 — Real-time autonomous drone defense system
      </text>

      <!-- Line 3: sub-output -->
      <text x="0" y="56" class="mono_t" font-size="12" font-weight="400" fill="#8a97a0" class="fadein2">
        ├── Upgrading YOLOv8 → YOLOv10 pipeline (2x throughput)
      </text>
      <text x="0" y="78" class="mono_t" font-size="12" font-weight="400" fill="#8a97a0" class="fadein2">
        ├── Adding multi-target Kalman fusion tracker
      </text>
      <text x="0" y="100" class="mono_t" font-size="12" font-weight="400" fill="#8a97a0" class="fadein2">
        └── Deploying 3D swarm visualization to production
      </text>

      <!-- Blinking cursor at the end -->
      <rect x="0" y="118" width="8" height="16" fill="#fbe2a7" class="cursor_t"/>
      <text x="16" y="132" class="mono_t" font-size="13" font-weight="700">
        <tspan fill="#e4a2b1">ankit@dev</tspan><tspan fill="#8a97a0">:</tspan><tspan fill="#fbe2a7">~/projects</tspan><tspan fill="#f5f0e8">$ </tspan>
      </text>
    </g>
  </g>
</svg>
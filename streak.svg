<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07070b"/>
      <stop offset="100%" style="stop-color:#0e0e17"/>
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="33%" style="stop-color:#6366f1"/>
      <stop offset="66%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <linearGradient id="skeuoChip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2d"/>
      <stop offset="100%" style="stop-color:#12121c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode { 0%, 100% { r: 5.5; opacity: 1; } 50% { r: 8; opacity: 0.4; } }
    @keyframes lineFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .node-1 { animation: pulseNode 2.2s ease-in-out infinite; }
    .node-2 { animation: pulseNode 2.2s ease-in-out infinite 0.55s; }
    .node-3 { animation: pulseNode 2.2s ease-in-out infinite 1.1s; }
    .node-4 { animation: pulseNode 2.2s ease-in-out infinite 1.65s; }
    .flow-line { animation: lineFlow 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)" rx="18"/>
  <rect x="1.5" y="1.5" width="1197" height="197" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <text class="sans" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="2">DEVELOPMENT PIPELINE</text>
    <text y="24" class="sans" font-size="20" font-weight="900" fill="#ffffff">Engineering Lifecycle Momentum</text>
  </g>

  <!-- Connecting dashed flow line -->
  <line x1="200" y1="125" x2="1000" y2="125" stroke="url(#pipeGrad)" stroke-width="2.5" stroke-dasharray="8 8" class="flow-line" opacity="0.65"/>

  <!-- Node 1 -->
  <g transform="translate(200, 125)">
    <circle cx="0" cy="0" r="28" fill="url(#skeuoChip)" stroke="#7c3aed" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#7c3aed" class="node-1" filter="url(#glow)"/>
    <text x="0" y="46" class="mono" font-size="12" fill="#a855f7" font-weight="800" text-anchor="middle" letter-spacing="1.5">DISCOVER</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(466, 125)">
    <circle cx="0" cy="0" r="28" fill="url(#skeuoChip)" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#6366f1" class="node-2" filter="url(#glow)"/>
    <text x="0" y="46" class="mono" font-size="12" fill="#818cf8" font-weight="800" text-anchor="middle" letter-spacing="1.5">ARCHITECT</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(733, 125)">
    <circle cx="0" cy="0" r="28" fill="url(#skeuoChip)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#38bdf8" class="node-3" filter="url(#glow)"/>
    <text x="0" y="46" class="mono" font-size="12" fill="#38bdf8" font-weight="800" text-anchor="middle" letter-spacing="1.5">COMMIT</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(1000, 125)">
    <circle cx="0" cy="0" r="28" fill="url(#skeuoChip)" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#06b6d4" class="node-4" filter="url(#glow)"/>
    <text x="0" y="46" class="mono" font-size="12" fill="#06b6d4" font-weight="800" text-anchor="middle" letter-spacing="1.5">DEPLOY</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3543;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#142732;stop-opacity:0.75"/>
    </linearGradient>

    <!-- Rail Progress Gradient -->
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="50%" style="stop-color:#e4a2b1"/>
      <stop offset="100%" style="stop-color:#fbe2a7"/>
    </linearGradient>

    <linearGradient id="skeuoChip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#254152"/>
      <stop offset="100%" style="stop-color:#172a36"/>
    </linearGradient>

    <filter id="creamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="activeHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes fillRail { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
    @keyframes breatheGlow { 0%, 100% { r: 7; opacity: 1; } 50% { r: 10; opacity: 0.45; } }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .rail-fill { stroke-dasharray: 800; stroke-dashoffset: 800; animation: fillRail 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .breathe-anim { animation: breatheGlow 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)" rx="16"/>

  <!-- Glass Container Panel -->
  <rect x="24" y="16" width="1152" height="168" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <text class="sans" font-size="12" font-weight="600" fill="#8a97a0" letter-spacing="2">DEVELOPMENT PIPELINE</text>
    <text y="24" class="sans" font-size="20" font-weight="900" fill="#fbe2a7">Engineering Lifecycle Momentum</text>
  </g>

  <!-- Horizontal Connected Progress Rail (Animated Fill) -->
  <line x1="200" y1="120" x2="1000" y2="120" stroke="#172a36" stroke-width="3"/>
  <line x1="200" y1="120" x2="1000" y2="120" stroke="url(#railGrad)" stroke-width="3" class="rail-fill" filter="url(#creamGlow)"/>

  <!-- Directional Chevrons between Stages -->
  <text x="333" y="124" class="mono" font-size="12" fill="#8a97a0" text-anchor="middle">❯❯</text>
  <text x="600" y="124" class="mono" font-size="12" fill="#8a97a0" text-anchor="middle">❯❯</text>
  <text x="866" y="124" class="mono" font-size="12" fill="#fbe2a7" text-anchor="middle">❯❯</text>

  <!-- Node 1: DISCOVER -->
  <g transform="translate(200, 120)">
    <circle cx="0" cy="0" r="26" fill="url(#skeuoChip)" stroke="#e4a2b1" stroke-width="1.5" filter="url(#roseGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#e4a2b1"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#e4a2b1" font-weight="800" text-anchor="middle" letter-spacing="1.5">DISCOVER</text>
  </g>

  <!-- Node 2: ARCHITECT -->
  <g transform="translate(466, 120)">
    <circle cx="0" cy="0" r="26" fill="url(#skeuoChip)" stroke="#fbe2a7" stroke-width="1.5" filter="url(#creamGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#fbe2a7"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#fbe2a7" font-weight="800" text-anchor="middle" letter-spacing="1.5">ARCHITECT</text>
  </g>

  <!-- Node 3: COMMIT -->
  <g transform="translate(733, 120)">
    <circle cx="0" cy="0" r="26" fill="url(#skeuoChip)" stroke="#e4a2b1" stroke-width="1.5" filter="url(#roseGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#e4a2b1"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#e4a2b1" font-weight="800" text-anchor="middle" letter-spacing="1.5">COMMIT</text>
  </g>

  <!-- Node 4: DEPLOY (Active Stage with Breathing Glow Halo) -->
  <g transform="translate(1000, 120)">
    <!-- Outer Glow Halo -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#fbe2a7" stroke-width="3" opacity="0.4" filter="url(#activeHalo)"/>
    <circle cx="0" cy="0" r="28" fill="url(#skeuoChip)" stroke="#fbe2a7" stroke-width="2" filter="url(#creamGlow)"/>
    <circle cx="0" cy="0" r="7" fill="#fbe2a7" class="breathe-anim" filter="url(#creamGlow)"/>
    <text x="0" y="44" class="mono" font-size="12" fill="#fbe2a7" font-weight="900" text-anchor="middle" letter-spacing="1.5">DEPLOY</text>
  </g>
</svg>
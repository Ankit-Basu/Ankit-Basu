<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#111122"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3f;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#14142b;stop-opacity:0.65"/>
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff00c8"/>
      <stop offset="50%" style="stop-color:#00e5c7"/>
      <stop offset="100%" style="stop-color:#ff00c8"/>
    </linearGradient>

    <linearGradient id="skeuoChip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#26264d"/>
      <stop offset="100%" style="stop-color:#15152b"/>
    </linearGradient>

    <filter id="magentaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    @keyframes lineFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
    @keyframes breatheGlow { 0%, 100% { r: 6; opacity: 1; } 50% { r: 9; opacity: 0.4; } }
    @keyframes ringSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .flow-line { animation: lineFlow 3s linear infinite; }
    .breathe-anim { animation: breatheGlow 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)" rx="16"/>

  <!-- Glass Container Panel -->
  <rect x="24" y="16" width="1152" height="168" rx="16" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#glassShadow)"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <text class="sans" font-size="12" font-weight="600" fill="#8b8ba7" letter-spacing="2">DEVELOPMENT PIPELINE</text>
    <text y="24" class="sans" font-size="20" font-weight="900" fill="#ff00c8">Engineering Lifecycle Momentum</text>
  </g>

  <!-- Connecting dashed flow line -->
  <line x1="200" y1="120" x2="1000" y2="120" stroke="url(#pipeGrad)" stroke-width="2" stroke-dasharray="8 8" class="flow-line" opacity="0.7"/>

  <!-- Node 1: DISCOVER -->
  <g transform="translate(200, 120)">
    <circle cx="0" cy="0" r="26" fill="url(#skeuoChip)" stroke="#00e5c7" stroke-width="1.5" filter="url(#tealGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#00e5c7"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#00e5c7" font-weight="800" text-anchor="middle" letter-spacing="1.5">DISCOVER</text>
  </g>

  <!-- Node 2: ARCHITECT -->
  <g transform="translate(466, 120)">
    <circle cx="0" cy="0" r="26" fill="url(#skeuoChip)" stroke="#ff00c8" stroke-width="1.5" filter="url(#magentaGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#ff00c8"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#ff00c8" font-weight="800" text-anchor="middle" letter-spacing="1.5">ARCHITECT</text>
  </g>

  <!-- Node 3: COMMIT -->
  <g transform="translate(733, 120)">
    <circle cx="0" cy="0" r="26" fill="url(#skeuoChip)" stroke="#00e5c7" stroke-width="1.5" filter="url(#tealGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#00e5c7"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#00e5c7" font-weight="800" text-anchor="middle" letter-spacing="1.5">COMMIT</text>
  </g>

  <!-- Node 4: DEPLOY (Active Stage with Breathing Pulse) -->
  <g transform="translate(1000, 120)">
    <circle cx="0" cy="0" r="28" fill="url(#skeuoChip)" stroke="#ff00c8" stroke-width="2" filter="url(#magentaGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#ff00c8" class="breathe-anim" filter="url(#magentaGlow)"/>
    <text x="0" y="42" class="mono" font-size="12" fill="#ff00c8" font-weight="800" text-anchor="middle" letter-spacing="1.5">DEPLOY</text>
  </g>
</svg>
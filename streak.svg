<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d171d"/>
      <stop offset="100%" style="stop-color:#14222b"/>
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbe2a7"/>
      <stop offset="50%" style="stop-color:#e4a7b1"/>
      <stop offset="100%" style="stop-color:#fbe2a7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode { 0%, 100% { r: 5.5; opacity: 1; } 50% { r: 8; opacity: 0.5; } }
    @keyframes lineFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .node-1 { animation: pulseNode 2.2s ease-in-out infinite; }
    .node-2 { animation: pulseNode 2.2s ease-in-out infinite 0.55s; }
    .node-3 { animation: pulseNode 2.2s ease-in-out infinite 1.1s; }
    .node-4 { animation: pulseNode 2.2s ease-in-out infinite 1.65s; }
    .flow-line { animation: lineFlow 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="960" height="200" fill="url(#bg)" rx="16"/>
  <rect x="1" y="1" width="958" height="198" rx="16" fill="none" stroke="#243744" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(36, 38)">
    <text class="sans" font-size="19" font-weight="900" fill="#fbe2a7">🔥 Engineering Momentum</text>
    <text y="20" class="mono" font-size="11" font-weight="500" fill="#859ba8">Consistency • continuous integration • shipping</text>
  </g>

  <!-- Connecting dashed line -->
  <line x1="180" y1="115" x2="780" y2="115" stroke="url(#pipeGrad)" stroke-width="2" stroke-dasharray="8 8" class="flow-line" opacity="0.6"/>

  <!-- NODE 1 -->
  <g transform="translate(180, 115)">
    <circle cx="0" cy="0" r="26" fill="#132029" stroke="#fbe2a7" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#fbe2a7" class="node-1" filter="url(#glow)"/>
    <text x="0" y="44" class="mono" font-size="12" fill="#fbe2a7" font-weight="800" text-anchor="middle" letter-spacing="1.5">LEARN</text>
  </g>

  <!-- NODE 2 -->
  <g transform="translate(380, 115)">
    <circle cx="0" cy="0" r="26" fill="#132029" stroke="#e4a7b1" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#e4a7b1" class="node-2" filter="url(#glow)"/>
    <text x="0" y="44" class="mono" font-size="12" fill="#e4a7b1" font-weight="800" text-anchor="middle" letter-spacing="1.5">BUILD</text>
  </g>

  <!-- NODE 3 -->
  <g transform="translate(580, 115)">
    <circle cx="0" cy="0" r="26" fill="#132029" stroke="#fbe2a7" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#fbe2a7" class="node-3" filter="url(#glow)"/>
    <text x="0" y="44" class="mono" font-size="12" fill="#fbe2a7" font-weight="800" text-anchor="middle" letter-spacing="1.5">COMMIT</text>
  </g>

  <!-- NODE 4 -->
  <g transform="translate(780, 115)">
    <circle cx="0" cy="0" r="26" fill="#132029" stroke="#e4a7b1" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5.5" fill="#e4a7b1" class="node-4" filter="url(#glow)"/>
    <text x="0" y="44" class="mono" font-size="12" fill="#e4a7b1" font-weight="800" text-anchor="middle" letter-spacing="1.5">REPEAT</text>
  </g>
</svg>
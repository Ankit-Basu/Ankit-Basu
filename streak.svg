<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="bgGrad_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>

    <!-- CRT Scanlines pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    @keyframes cursorBlink_t {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeIn_t1 {
      0%, 35% { opacity: 0; }
      55%, 100% { opacity: 1; }
    }
    @keyframes fadeIn_t2 {
      0%, 50% { opacity: 0; }
      70%, 100% { opacity: 1; }
    }
    @keyframes fadeIn_t3 {
      0%, 65% { opacity: 0; }
      85%, 100% { opacity: 1; }
    }

    .mono_t { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .cursor_t { animation: cursorBlink_t 0.9s step-end infinite; }
    .line-fade1 { opacity: 0; animation: fadeIn_t1 2.8s ease forwards; }
    .line-fade2 { opacity: 0; animation: fadeIn_t2 2.8s ease forwards; }
    .line-fade3 { opacity: 0; animation: fadeIn_t3 2.8s ease forwards; }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bgGrad_t)" rx="16"/>

  <!-- Terminal Window Frame -->
  <g transform="translate(48, 18)">
    <!-- Terminal body -->
    <rect width="1104" height="204" rx="12" fill="#091820" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Title bar -->
    <rect width="1104" height="34" rx="12" fill="#0d202b"/>
    <rect y="12" width="1104" height="22" fill="#0d202b"/>
    <line x1="0" y1="34" x2="1104" y2="34" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Traffic light dots -->
    <circle cx="22" cy="17" r="5.5" fill="#e4a2b1" opacity="0.9"/>
    <circle cx="40" cy="17" r="5.5" fill="#fbe2a7" opacity="0.9"/>
    <circle cx="58" cy="17" r="5.5" fill="#2b4759" opacity="0.7"/>

    <!-- Title text -->
    <text x="552" y="21" class="mono_t" font-size="11.5" font-weight="700" fill="#8a97a0" text-anchor="middle">ankit@system ~ /production</text>

    <!-- Scanline texture -->
    <rect y="35" width="1104" height="169" fill="url(#scanlines)" rx="0"/>

    <!-- Terminal content -->
    <g transform="translate(26, 58)">
      <!-- Line 1: prompt + command -->
      <text x="0" y="0" class="mono_t" font-size="13" font-weight="700">
        <tspan fill="#e4a2b1">ankit@system</tspan><tspan fill="#8a97a0">:</tspan><tspan fill="#fbe2a7">~/production</tspan><tspan fill="#f5f0e8">$ currently_building</tspan>
      </text>

      <!-- Line 2: output -->
      <text x="0" y="28" class="mono_t line-fade1" font-size="12.5" font-weight="600" fill="#fbe2a7">&#x2192; SUDARSHAN-X v2.0 &#x2014; Real-time autonomous drone defense system</text>

      <!-- Line 3-5: tree output -->
      <text x="0" y="52" class="mono_t line-fade2" font-size="12" font-weight="400" fill="#8a97a0">&#x251C;&#x2500;&#x2500; Upgrading YOLOv8 &#x2192; YOLOv10 pipeline (2x throughput)</text>
      <text x="0" y="74" class="mono_t line-fade2" font-size="12" font-weight="400" fill="#8a97a0">&#x251C;&#x2500;&#x2500; Adding multi-target Kalman fusion tracker</text>
      <text x="0" y="96" class="mono_t line-fade3" font-size="12" font-weight="400" fill="#8a97a0">&#x2514;&#x2500;&#x2500; Deploying 3D swarm visualization to production</text>

      <!-- Blinking cursor + new prompt -->
      <g class="line-fade3">
        <rect x="0" y="112" width="8" height="16" fill="#fbe2a7" class="cursor_t"/>
        <text x="16" y="125" class="mono_t" font-size="13" font-weight="700">
          <tspan fill="#e4a2b1">ankit@system</tspan><tspan fill="#8a97a0">:</tspan><tspan fill="#fbe2a7">~/production</tspan><tspan fill="#f5f0e8">$ </tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
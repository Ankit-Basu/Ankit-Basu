<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="bgGrad_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1c24"/>
      <stop offset="100%" style="stop-color:#162a36"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes cursorBlink_t {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeIn_t1 {
      0%, 40% { opacity: 0; }
      60%, 100% { opacity: 1; }
    }
    @keyframes fadeIn_t2 {
      0%, 55% { opacity: 0; }
      75%, 100% { opacity: 1; }
    }
    @keyframes fadeIn_t3 {
      0%, 65% { opacity: 0; }
      85%, 100% { opacity: 1; }
    }

    .mono_t { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .cursor_t { animation: cursorBlink_t 0.9s step-end infinite; }
    .line-fade1 { opacity: 0; animation: fadeIn_t1 3s ease forwards; }
    .line-fade2 { opacity: 0; animation: fadeIn_t2 3s ease forwards; }
    .line-fade3 { opacity: 0; animation: fadeIn_t3 3s ease forwards; }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bgGrad_t)" rx="16"/>

  <!-- Terminal Window Frame -->
  <g transform="translate(48, 20)">
    <!-- Terminal body -->
    <rect width="1104" height="200" rx="12" fill="#0a1a22" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Title bar -->
    <rect width="1104" height="36" rx="12" fill="#0d1f2a"/>
    <rect y="12" width="1104" height="24" fill="#0d1f2a"/>

    <!-- Traffic light dots -->
    <circle cx="22" cy="18" r="6" fill="#e4a2b1" opacity="0.9"/>
    <circle cx="42" cy="18" r="6" fill="#fbe2a7" opacity="0.9"/>
    <circle cx="62" cy="18" r="6" fill="#2b4759" opacity="0.6"/>

    <!-- Title text -->
    <text x="552" y="22" class="mono_t" font-size="12" font-weight="700" fill="#8a97a0" text-anchor="middle">ankit@dev ~ /projects</text>

    <!-- Terminal content -->
    <g transform="translate(24, 56)">
      <!-- Line 1: prompt + command (always visible) -->
      <text x="0" y="0" class="mono_t" font-size="13" font-weight="700">
        <tspan fill="#e4a2b1">ankit@dev</tspan><tspan fill="#8a97a0">:</tspan><tspan fill="#fbe2a7">~/projects</tspan><tspan fill="#f5f0e8">$ currently_building</tspan>
      </text>

      <!-- Line 2: output (fades in) -->
      <text x="0" y="30" class="mono_t line-fade1" font-size="13" font-weight="600" fill="#fbe2a7">&#x2192; SUDARSHAN-X v2.0 &#x2014; Real-time autonomous drone defense system</text>

      <!-- Line 3-5: tree output (fades in later) -->
      <text x="0" y="56" class="mono_t line-fade2" font-size="12" font-weight="400" fill="#8a97a0">&#x251C;&#x2500;&#x2500; Upgrading YOLOv8 &#x2192; YOLOv10 pipeline (2x throughput)</text>
      <text x="0" y="78" class="mono_t line-fade2" font-size="12" font-weight="400" fill="#8a97a0">&#x251C;&#x2500;&#x2500; Adding multi-target Kalman fusion tracker</text>
      <text x="0" y="100" class="mono_t line-fade3" font-size="12" font-weight="400" fill="#8a97a0">&#x2514;&#x2500;&#x2500; Deploying 3D swarm visualization to production</text>

      <!-- Blinking cursor + new prompt (fades in last) -->
      <g class="line-fade3">
        <rect x="0" y="118" width="8" height="16" fill="#fbe2a7" class="cursor_t"/>
        <text x="16" y="132" class="mono_t" font-size="13" font-weight="700">
          <tspan fill="#e4a2b1">ankit@dev</tspan><tspan fill="#8a97a0">:</tspan><tspan fill="#fbe2a7">~/projects</tspan><tspan fill="#f5f0e8">$ </tspan>
        </text>
      </g>
    </g>
  </g>
</svg>